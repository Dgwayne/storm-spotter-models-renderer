name: Render HRRR

on:
  schedule:
    # Every 15 minutes. HRRR runs every hour and publishes ~50-60 min after each
    # run hour. decode_pipeline.sh is idempotent (skips already-rendered frames)
    # and exits clean if the source GRIB isn't published yet.
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

concurrency:
  group: render-hrrr
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    defaults:
      run:
        shell: bash -el {0}    # ensures conda env is activated for every step

    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba (wgrib2 + gdal + rclone)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: renderer
          create-args: >-
            python=3.11
            wgrib2
            gdal
            rclone
            pyyaml
            curl
          cache-environment: true
          init-shell: bash

      - name: Install yq (Go binary)
        run: |
          set -e
          sudo curl -sSfL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
          wgrib2 --version || true
          gdalinfo --version
          rclone --version | head -1

      - name: Configure rclone for Cloudflare R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          EOF

      - name: Render HRRR
        run: bash scripts/render_hrrr.sh
