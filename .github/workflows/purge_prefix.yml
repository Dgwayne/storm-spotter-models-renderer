name: Purge bucket prefix

# Manual utility: delete every object under one v1/ prefix so the next
# render tick re-creates those frames from scratch. This is the surgical
# alternative to force_rerender when ONE product's palette or convert was
# wrong (first use: the Celsius-keyed irsat palette, 2026-08-05) — the
# idempotent sweeps skip frames that exist, so a bad batch must be
# deleted to be re-rendered.
#
# NOT cron-dispatched — no stp-models-cron CRON_TO_WORKFLOW entry needed.

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: 'Space-separated bucket prefixes to delete, e.g. "v1/HRRR/irsat/" or "v1/GFS013/ v1/UKMO/" (each must be v1/<MODEL>/ or v1/<MODEL>/<product>/)'
        type: string
        required: true

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_BUCKET: ${{ secrets.B2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate prefixes
        # MODEL-level (v1/<MODEL>/) is allowed as well as product-level:
        # a wrong source-grid georeference invalidates every product of a
        # model at once (2026-08-14), and 200 product-level dispatches to
        # express that is worse than one scoped list. Still refuses bare
        # "v1/" or anything outside it.
        env:
          PREFIXES: ${{ inputs.prefix }}
        run: |
          set -e
          for p in $PREFIXES; do
            case "$p" in
              v1/*/*/|v1/*/) [ "$p" = "v1/" ] && { echo "::error::refusing bare v1/"; exit 1; }
                             echo "prefix OK: $p" ;;
              *) echo "::error::'$p' must look like v1/<MODEL>/ or v1/<MODEL>/<product>/ — refusing broad or malformed deletes"; exit 1 ;;
            esac
          done

      - name: Install rclone
        run: |
          curl -sSfL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1 || sudo apt-get install -y rclone
          rclone --version | head -1

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Other
          region = us-west-004
          no_check_bucket = true
          access_key_id = ${{ secrets.B2_KEY_ID }}
          secret_access_key = ${{ secrets.B2_APP_KEY }}
          endpoint = ${{ secrets.B2_S3_ENDPOINT }}
          EOF

      - name: Delete prefixes
        env:
          PREFIXES: ${{ inputs.prefix }}
          BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -e
          for p in $PREFIXES; do
            COUNT=$(rclone lsf --recursive "r2:${BUCKET}/${p}" --files-only | wc -l)
            echo "deleting ${COUNT} objects under ${p}"
            rclone delete "r2:${BUCKET}/${p}" --rmdirs || true
          done
          echo "done"

      - name: Republish manifests for purged models
        # A model-level purge deletes manifest.json too, and until the
        # model's next sweep the CDN 404s — which the freshness monitor
        # correctly (and noisily: 6 emails on 2026-08-14) reports as an
        # outage. Rebuild an honest empty-or-partial manifest immediately
        # so a purge is never externally visible as anything but
        # "no runs yet". Works for product-level prefixes too (the
        # rebuilt manifest simply stops listing the deleted frames).
        env:
          PREFIXES: ${{ inputs.prefix }}
        run: |
          set -e
          python3 -m pip install --no-input pyyaml
          MODELS=$(for p in $PREFIXES; do echo "$p" | cut -d/ -f2; done | sort -u)
          for m in $MODELS; do
            echo "rebuilding manifest for $m"
            python3 scripts/build_manifest.py "$m" || echo "  (manifest rebuild failed for $m; next sweep covers it)"
          done
