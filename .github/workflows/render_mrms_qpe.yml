name: Render MRMS QPE (OBS)

on:
  schedule:
    # Every 15 minutes, staggered off the HRRR (:05) and RRFS (:10) ticks.
    # MRMS Pass1 publishes ~:16 after each valid hour and Pass2 ~:58, so the
    # :17 tick catches the Pass1 bridge within a minute and the :02 tick
    # settles the hour with Pass2. GitHub cron is best-effort; the
    # cron-trigger Worker dispatches this workflow on the reliable schedule.
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      force_rerender:
        description: 'Re-render frames even when already on R2 (bypass idempotency check).'
        type: boolean
        default: false

concurrency:
  group: render-mrms-qpe
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_BUCKET: ${{ secrets.B2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
      FORCE_RERENDER: ${{ inputs.force_rerender && '1' || '' }}

    defaults:
      run:
        shell: bash -el {0}    # ensures conda env is activated for every step

    steps:
      - uses: actions/checkout@v4

      # No wgrib2 needed — MRMS QPE files are single-message gribs that
      # GDAL's GRIB driver reads directly.
      - name: Restore micromamba binary (cache)
        id: mmbin
        uses: actions/cache/restore@v4
        with:
          path: ~/micromamba-bin/micromamba
          key: micromamba-bin-linux64-v1

      - name: Set up micromamba (gdal + rclone)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: renderer
          create-args: >-
            python=3.11
            gdal
            libgdal-grib
            rclone
            pyyaml
            curl
          cache-environment: true
          init-shell: bash
          download-micromamba: ${{ steps.mmbin.outputs.cache-hit != 'true' }}
          micromamba-binary-path: ~/micromamba-bin/micromamba

      - name: Save micromamba binary (cache)
        if: steps.mmbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/micromamba-bin/micromamba
          key: micromamba-bin-linux64-v1

      - name: Restore yq (cache)
        id: yqcache
        uses: actions/cache/restore@v4
        with:
          path: ~/.tools/yq
          key: yq-v4.53.3-linux-amd64

      - name: Install yq (Go binary)
        run: |
          set -e
          if [ ! -x "$HOME/.tools/yq" ]; then
            mkdir -p "$HOME/.tools"
            curl -sSfL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 40 \
              -o "$HOME/.tools/yq" \
              https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
            chmod +x "$HOME/.tools/yq"
          fi
          sudo install -m 0755 "$HOME/.tools/yq" /usr/local/bin/yq
          yq --version
          gdalinfo --version
          rclone --version | head -1

      - name: Save yq (cache)
        if: steps.yqcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.tools/yq
          key: yq-v4.53.3-linux-amd64

      - name: Configure rclone for Cloudflare R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Other
          region = us-west-004
          no_check_bucket = true
          access_key_id = ${{ secrets.B2_KEY_ID }}
          secret_access_key = ${{ secrets.B2_APP_KEY }}
          endpoint = ${{ secrets.B2_S3_ENDPOINT }}
          EOF

      - name: Render MRMS QPE
        run: bash scripts/render_mrms_qpe.sh

      # The observation catalog (hail / echo tops / VIL / rotation /
      # FLASH) rides the same 15-min tick — latest-frame products, no
      # Pass cycle, own script. Runs even if a transient QPE failure
      # killed the step above.
      - name: Render MRMS observation catalog
        if: ${{ success() || failure() }}
        run: bash scripts/render_mrms_obs.sh
