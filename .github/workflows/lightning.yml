name: Lightning (GLM)

# Near-real-time GOES GLM lightning feed.
#
# GitHub's short crons (e.g. */5) are unreliable — they're frequently
# delayed or skipped entirely under load, which freezes the feed and the
# app (correctly) drops everything older than its 15-min window. So the
# feed must NOT depend on frequent cron ticks.
#
# Instead each run sets up once and then LOOPS for ~2h30m, rebuilding
# flashes.json from the newest GLM granules every ~15-20 s, while a
# reliable low-frequency cron (every 2 h) starts the next run. Runs
# OVERLAP by design (~30 min): there is deliberately NO concurrency
# group. The old cancel-in-progress handoff froze the feed for the whole
# time the successor sat in GitHub's runner queue (measured 11+ min on
# 2026-08-15, up to 12x/day) because the cancel fires at run *creation*,
# not run start. With overlap, the outgoing run keeps writing until the
# incoming one is looping; two writers co-writing the same feed is
# harmless (each pass rebuilds the full window from source, last write
# wins, both fresh). The stp-models-cron Worker additionally watchdogs
# the feed's generatedAt and dispatches this workflow if it ever goes
# stale (skipped cron tick, crashed run).
#
# DEPLOY NOTE: with no cancel-in-progress, a workflow_dispatch after a
# code change does NOT stop the already-running loop — it keeps running
# OLD code until its END (≤2h30m). To cut over immediately:
# `gh run cancel <old>` then dispatch.
#
# Public repo => unlimited Actions minutes, so the long loop is free.
# This is a data pipeline for the app, not a hosted server.

on:
  # CUTOVER 2026-08-27: the DGWayneserver box (Task Scheduler entry
  # STP-Prod-LIGHTNING, a bounded 10-min loop re-fired every 5 min, flock
  # makes overlap a no-op) is now the steady-state writer of flashes.json.
  # This cron is commented out because it started a 2h30m loop
  # UNCONDITIONALLY, which would make Actions a second writer racing the
  # box for the same key. GitHub is now PURE FALLBACK: the stp-models-cron
  # Worker's lightning dead-man dispatches this workflow only when the feed
  # is >300s stale AND no run is queued/in progress, so if the box loses
  # power or ISP, Actions resumes by itself within one Worker tick.
  # To hand the feed back to Actions, uncomment this cron and disable the
  # box task: Disable-ScheduledTask -TaskName STP-Prod-LIGHTNING
  # schedule:
  #   - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  lightning:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    env:
      R2_BUCKET: ${{ secrets.B2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}

    defaults:
      run:
        shell: bash -el {0}    # ensures the micromamba env is active per step

    steps:
      - uses: actions/checkout@v4

      - name: Restore micromamba binary (cache)
        id: mmbin
        uses: actions/cache/restore@v4
        with:
          path: ~/micromamba-bin/micromamba
          key: micromamba-bin-linux64-v1

      - name: Set up micromamba (netCDF4 + boto3 + rclone)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lightning
          create-args: >-
            python=3.11
            netcdf4
            numpy
            boto3
            botocore
            rclone
          cache-environment: true
          init-shell: bash
          download-micromamba: ${{ steps.mmbin.outputs.cache-hit != 'true' }}
          micromamba-binary-path: ~/micromamba-bin/micromamba

      - name: Save micromamba binary (cache)
        if: steps.mmbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/micromamba-bin/micromamba
          key: micromamba-bin-linux64-v1

      - name: Configure rclone for Cloudflare R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Other
          region = us-west-004
          no_check_bucket = true
          access_key_id = ${{ secrets.B2_KEY_ID }}
          secret_access_key = ${{ secrets.B2_APP_KEY }}
          endpoint = ${{ secrets.B2_S3_ENDPOINT }}
          EOF

      - name: Stream GLM lightning to R2 (long loop)
        run: |
          set -uo pipefail
          # Loop ~2h30m: long enough that the 2-hourly cron's next run
          # overlaps this one even with GitHub's observed cron drift
          # (ticks land up to ~2h06m apart) plus queue + setup time, so
          # the handoff has no gap. Short enough that a stale-code run
          # after a deploy ages out within a couple hours.
          END=$(( $(date -u +%s) + 9000 ))
          PASS=0
          FAILS=0
          while [ "$(date -u +%s)" -lt "$END" ]; do
            PASS=$((PASS + 1))
            if ! python scripts/lightning_glm.py; then
              FAILS=$((FAILS + 1))
              echo "  pass ${PASS} failed (${FAILS} total)"
            fi
            # GLM granules publish every 20 s. With the parse-sidecar cache
            # (lightning_glm.py) a warm pass is ~2-4 s, so ~4 s sleep gives a
            # ~6-8 s tick — each granule reaches the feed seconds after it
            # lands. Listing stays ~2 buckets x 2-3 prefixes per pass, well
            # within AWS open-data etiquette.
            [ "$(date -u +%s)" -lt "$END" ] && sleep 4 || true
          done
          echo "==> loop done after ${PASS} passes (${FAILS} failures)"
