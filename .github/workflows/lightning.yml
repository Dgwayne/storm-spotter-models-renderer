name: Lightning (GLM)

# Near-real-time GOES GLM lightning feed.
#
# GitHub's short crons (e.g. */5) are unreliable — they're frequently
# delayed or skipped entirely under load, which freezes the feed and the
# app (correctly) drops everything older than its 15-min window. So the
# feed must NOT depend on frequent cron ticks.
#
# Instead each run sets up once and then LOOPS for up to ~5h50m,
# rebuilding flashes.json from the newest GLM granules every ~25 s. A
# reliable low-frequency cron (every 2 h — long crons are honored far
# more reliably than short ones) restarts it via cancel-in-progress, and
# because one run lasts hours, even a delayed or skipped scheduled tick
# can't stale the feed — the current run just keeps going on its own.
#
# Public repo => unlimited Actions minutes, so the long loop is free.
# This is a data pipeline for the app, not a hosted server.

on:
  schedule:
    - cron: '0 */2 * * *'    # every 2 h — reliable; just needs to restart the loop
  workflow_dispatch:

concurrency:
  group: lightning-glm
  cancel-in-progress: true   # a fresh tick supersedes the long-running loop

jobs:
  lightning:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    defaults:
      run:
        shell: bash -el {0}    # ensures the micromamba env is active per step

    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba (netCDF4 + boto3 + rclone)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lightning
          create-args: >-
            python=3.11
            netcdf4
            numpy
            boto3
            botocore
            rclone
          cache-environment: true
          init-shell: bash

      - name: Configure rclone for Cloudflare R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          EOF

      - name: Stream GLM lightning to R2 (long loop)
        run: |
          set -uo pipefail
          # Loop up to ~5h50m, refreshing every ~25 s. The 2-hourly cron
          # normally cancels + restarts this well before the cap, so the
          # cap only matters if a scheduled tick is delayed/skipped —
          # then this run keeps the feed fresh on its own instead of
          # going stale.
          END=$(( $(date -u +%s) + 21000 ))
          PASS=0
          FAILS=0
          while [ "$(date -u +%s)" -lt "$END" ]; do
            PASS=$((PASS + 1))
            if ! python scripts/lightning_glm.py; then
              FAILS=$((FAILS + 1))
              echo "  pass ${PASS} failed (${FAILS} total)"
            fi
            [ "$(date -u +%s)" -lt "$END" ] && sleep 25 || true
          done
          echo "==> loop done after ${PASS} passes (${FAILS} failures)"
