name: Render RTMA Surface (Observations)

# RTMA surface-observation grids (t2m/td2m/thetae/wind10m/gust10m) for the
# app's Observations layer. Rapid-Update publishes a new analysis every
# 15 minutes (~20-30 min behind real time), so freshness needs a new
# analysis noticed within a few minutes of it appearing.
#
# Same reliability pattern as wind.yml/lightning.yml: GitHub's short crons
# are unreliable, so each run LOOPS for ~55 min checking every 3 min (an
# idle pass is one idx HEAD + one rclone LIST, ~2 s) and an hourly cron
# restarts it via cancel-in-progress. A delayed or skipped tick just means
# the current loop keeps covering.

on:
  schedule:
    - cron: '8 * * * *'
  workflow_dispatch:
    inputs:
      force_rerender:
        description: 'Re-render the newest analysis even if already on R2.'
        type: boolean
        default: false

concurrency:
  group: render-rtma
  cancel-in-progress: true

jobs:
  rtma:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      R2_BUCKET: ${{ secrets.B2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
      FORCE_RERENDER: ${{ inputs.force_rerender && '1' || '' }}

    defaults:
      run:
        shell: bash -el {0}    # ensures the micromamba env is active per step

    steps:
      - uses: actions/checkout@v4

      # No wgrib2 — the script publishes wind SPEED only (rotation-
      # invariant), and GDAL's GRIB driver reads the Lambert grid directly.
      - name: Set up micromamba (gdal + numpy + rclone)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: renderer
          create-args: >-
            python=3.11
            gdal
            libgdal-grib
            numpy
            rclone
            pyyaml
            curl
          cache-environment: true
          init-shell: bash

      - name: Install yq (Go binary)
        run: |
          set -e
          sudo curl -sSfL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
          gdalinfo --version
          rclone --version | head -1

      - name: Configure rclone for Cloudflare R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Other
          region = us-west-004
          no_check_bucket = true
          access_key_id = ${{ secrets.B2_KEY_ID }}
          secret_access_key = ${{ secrets.B2_APP_KEY }}
          endpoint = ${{ secrets.B2_S3_ENDPOINT }}
          EOF

      - name: Render RTMA surface (long loop)
        run: |
          set -uo pipefail
          # ~55 min of passes; the hourly cron restarts the loop before
          # the cap in the normal case (cancel-in-progress).
          END=$(( $(date -u +%s) + 3300 ))
          PASS=0
          FAILS=0
          while [ "$(date -u +%s)" -lt "$END" ]; do
            PASS=$((PASS + 1))
            if ! bash scripts/render_rtma_obs.sh; then
              FAILS=$((FAILS + 1))
              echo "  pass ${PASS} failed (${FAILS} total)"
            fi
            # A dispatch-triggered force pass shouldn't force forever.
            FORCE_RERENDER=""
            [ "$(date -u +%s)" -lt "$END" ] && sleep 180 || true
          done
          echo "==> loop done after ${PASS} passes (${FAILS} failures)"
