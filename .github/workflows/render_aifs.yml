name: Render AIFS

on:
  # NO `schedule:` HERE ON PURPOSE (removed 2026-08-17; was '12,42 * * * *').
  # The cron-trigger Worker dispatches this workflow (cron-trigger/src/worker.js),
  # and a native cron alongside it is not a harmless backstop. With
  # `cancel-in-progress: false` GitHub keeps at most one running plus one
  # PENDING run per concurrency group, so every extra tick CANCELS the pending
  # run and sends a "Run failed / Some jobs were not successful" email.
  # Measured over 3.5 h on 2026-08-17: 124 cancelled vs 49 successful runs,
  # zero genuine failures, queue waits of 19 min median and 84 min worst.
  # To restore a backstop, add it to the Worker instead, not here.
  workflow_dispatch:
    inputs:
      force_rerender:
        description: 'Re-render frames even when already on R2 (bypass idempotency check). Used to recover from a pipeline-bug-produced corrupt batch.'
        type: boolean
        default: false

concurrency:
  group: render-aifs
  cancel-in-progress: false

# Fan-out structure (introduced 2026-08-05 to hold the tick inside the cron
# cadence as the product catalog grows):
#   plan     — turns products.yml's models.AIFS.render_groups into a job
#              matrix, and FAILS if the groups don't exactly cover the
#              product list (a product outside every group would silently
#              never render).
#   render   — one job per group, PRODUCT_FILTER-scoped, SKIP_FINALIZE=1.
#              Each group still publishes an early manifest after the newest
#              run renders (build_manifest.py snapshots a fresh bucket
#              listing, so concurrent publishes are all valid).
#   finalize — single post-fan-out job: prune to retain_runs, then the
#              authoritative manifest rebuild. Runs even when a group fails
#              (a red group just leaves its frames missing; the manifest
#              must still move forward for the app).
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore yq (cache)
        id: yqcache
        uses: actions/cache/restore@v4
        with:
          path: ~/.tools/yq
          key: yq-v4.53.3-linux-amd64

      - name: Install yq (Go binary)
        run: |
          set -e
          if [ ! -x "$HOME/.tools/yq" ]; then
            mkdir -p "$HOME/.tools"
            curl -sSfL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 40 \
              -o "$HOME/.tools/yq" \
              https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
            chmod +x "$HOME/.tools/yq"
          fi
          sudo install -m 0755 "$HOME/.tools/yq" /usr/local/bin/yq

      - name: Save yq (cache)
        if: steps.yqcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.tools/yq
          key: yq-v4.53.3-linux-amd64

      - name: Build render-group matrix
        id: groups
        run: |
          set -e
          covered=$(yq -r '.models.AIFS.render_groups[][]' config/products.yml | sort)
          declared=$(yq -r '.models.AIFS.products[]' config/products.yml | sort)
          dupes=$(printf '%s\n' "$covered" | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::products listed in more than one render group:"
            echo "$dupes"
            exit 1
          fi
          if ! diff <(printf '%s\n' "$covered") <(printf '%s\n' "$declared"); then
            echo "::error::render_groups do not exactly cover models.AIFS.products (diff above: < only-in-groups, > only-in-products)"
            exit 1
          fi
          matrix=$(yq -o=json -I=0 \
            '[.models.AIFS.render_groups | to_entries[] | {"group": .key, "products": (.value | join(" "))}]' \
            config/products.yml)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "matrix: ${matrix}"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: render (${{ matrix.group }})
    strategy:
      # One group failing must not cancel the others — each group's frames
      # are independent, and the finalize job reconciles whatever landed.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      R2_BUCKET: ${{ secrets.B2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
      FORCE_RERENDER: ${{ inputs.force_rerender && '1' || '' }}
      PRODUCT_FILTER: ${{ matrix.products }}
      SKIP_FINALIZE: '1'

    defaults:
      run:
        shell: bash -el {0}    # ensures conda env is activated for every step

    steps:
      - uses: actions/checkout@v4

      - name: Restore micromamba binary (cache)
        id: mmbin
        uses: actions/cache/restore@v4
        with:
          path: ~/micromamba-bin/micromamba
          key: micromamba-bin-linux64-v1

      - name: Set up micromamba (wgrib2 + gdal + rclone)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: renderer
          create-args: >-
            python=3.11
            wgrib2
            gdal
            libgdal-netcdf
            libgdal-grib
            rclone
            pyyaml
            curl
          cache-environment: true
          init-shell: bash
          download-micromamba: ${{ steps.mmbin.outputs.cache-hit != 'true' }}
          micromamba-binary-path: ~/micromamba-bin/micromamba

      - name: Save micromamba binary (cache)
        if: steps.mmbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/micromamba-bin/micromamba
          key: micromamba-bin-linux64-v1

      - name: Restore yq (cache)
        id: yqcache
        uses: actions/cache/restore@v4
        with:
          path: ~/.tools/yq
          key: yq-v4.53.3-linux-amd64

      - name: Install yq (Go binary)
        run: |
          set -e
          if [ ! -x "$HOME/.tools/yq" ]; then
            mkdir -p "$HOME/.tools"
            curl -sSfL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 40 \
              -o "$HOME/.tools/yq" \
              https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
            chmod +x "$HOME/.tools/yq"
          fi
          sudo install -m 0755 "$HOME/.tools/yq" /usr/local/bin/yq
          yq --version
          wgrib2 --version || true
          gdalinfo --version
          rclone --version | head -1

      - name: Save yq (cache)
        if: steps.yqcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.tools/yq
          key: yq-v4.53.3-linux-amd64

      - name: Configure rclone for Cloudflare R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Other
          region = us-west-004
          no_check_bucket = true
          access_key_id = ${{ secrets.B2_KEY_ID }}
          secret_access_key = ${{ secrets.B2_APP_KEY }}
          endpoint = ${{ secrets.B2_S3_ENDPOINT }}
          EOF

      - name: Render AIFS (${{ matrix.group }})
        run: bash scripts/render_aifs.sh

  finalize:
    needs: render
    # Run on partial group failure too (default behavior would skip us);
    # only a cancelled workflow skips finalize.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_BUCKET: ${{ secrets.B2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Restore micromamba binary (cache)
        id: mmbin
        uses: actions/cache/restore@v4
        with:
          path: ~/micromamba-bin/micromamba
          key: micromamba-bin-linux64-v1

      - name: Set up micromamba (wgrib2 + gdal + rclone)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: renderer
          create-args: >-
            python=3.11
            wgrib2
            gdal
            libgdal-netcdf
            libgdal-grib
            rclone
            pyyaml
            curl
          cache-environment: true
          init-shell: bash
          download-micromamba: ${{ steps.mmbin.outputs.cache-hit != 'true' }}
          micromamba-binary-path: ~/micromamba-bin/micromamba

      - name: Save micromamba binary (cache)
        if: steps.mmbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/micromamba-bin/micromamba
          key: micromamba-bin-linux64-v1

      - name: Configure rclone for Cloudflare R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Other
          region = us-west-004
          no_check_bucket = true
          access_key_id = ${{ secrets.B2_KEY_ID }}
          secret_access_key = ${{ secrets.B2_APP_KEY }}
          endpoint = ${{ secrets.B2_S3_ENDPOINT }}
          EOF

      - name: Prune + rebuild manifest
        run: |
          set -e
          RETAIN=$(python3 - <<'EOF'
          import yaml
          cfg = yaml.safe_load(open("config/products.yml"))
          print(cfg["models"]["AIFS"].get("retain_runs", 5))
          EOF
          )
          echo "==> Pruning AIFS to last ${RETAIN} runs"
          python3 scripts/prune_old_runs.py AIFS "${RETAIN}"
          echo "==> Rebuilding AIFS manifest"
          python3 scripts/build_manifest.py AIFS
