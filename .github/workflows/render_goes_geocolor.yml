name: Render GOES GeoColor

# Rolling window of GOES-East GeoColor frames for the app's satellite
# animation, sourced from NASA GIBS (true-color RGB has no IEM single-band
# equivalent). Writes a SEPARATE manifest (v1/SAT/geocolor.json) + frame
# folder (v1/SAT/geocolor/), leaving the shared v1/SAT/manifest.json used by
# already-installed apps completely untouched.
#
# Each run renders any 10-min slot in the last ~12 h not already on B2 and
# rebuilds geocolor.json, so a delayed/skipped tick is backfilled next run.
# GIBS already serves EPSG:3857 at our bbox, so no gdal is needed — this job
# only needs python + rclone. Public repo => unlimited Actions minutes.

on:
  # NO `schedule:` HERE ON PURPOSE (removed 2026-08-17; was '4,14,24,34,44,54 * * * *').
  # The cron-trigger Worker dispatches this workflow (cron-trigger/src/worker.js),
  # and a native cron alongside it is not a harmless backstop. With
  # `cancel-in-progress: false` GitHub keeps at most one running plus one
  # PENDING run per concurrency group, so every extra tick CANCELS the pending
  # run and sends a "Run failed / Some jobs were not successful" email.
  # Measured over 3.5 h on 2026-08-17: 124 cancelled vs 49 successful runs,
  # zero genuine failures, queue waits of 19 min median and 84 min worst.
  # To restore a backstop, add it to the Worker instead, not here.
  workflow_dispatch:
    inputs:
      force_rerender:
        description: 'Re-fetch every slot in the window even if already on B2.'
        type: boolean
        default: false
      repair_scan:
        description: 'Re-check stored frames and replace any that fail the quality gate (non-destructive).'
        type: boolean
        default: false

concurrency:
  group: render-goes-geocolor
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # STAR adds a full-disk download + decode + N warps per slot on top of the
    # GIBS and SLIDER passes.
    timeout-minutes: 45
    env:
      R2_BUCKET: ${{ secrets.B2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
      FORCE_RERENDER: ${{ inputs.force_rerender && '1' || '' }}
      REPAIR_SCAN: ${{ inputs.repair_scan && '1' || '' }}

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Restore micromamba binary (cache)
        id: mmbin
        uses: actions/cache/restore@v4
        with:
          path: ~/micromamba-bin/micromamba
          key: micromamba-bin-linux64-v1

      - name: Set up micromamba (python + rclone + pillow)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: geocolor
          create-args: >-
            python=3.11
            rclone
            pillow
            rasterio
          cache-environment: true
          init-shell: bash
          download-micromamba: ${{ steps.mmbin.outputs.cache-hit != 'true' }}
          micromamba-binary-path: ~/micromamba-bin/micromamba

      - name: Save micromamba binary (cache)
        if: steps.mmbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/micromamba-bin/micromamba
          key: micromamba-bin-linux64-v1

      - name: Configure rclone for Cloudflare R2 (Backblaze B2)
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Other
          region = us-west-004
          no_check_bucket = true
          access_key_id = ${{ secrets.B2_KEY_ID }}
          secret_access_key = ${{ secrets.B2_APP_KEY }}
          endpoint = ${{ secrets.B2_S3_ENDPOINT }}
          EOF

      - name: Render GeoColor frames
        run: python scripts/render_goes_geocolor.py
