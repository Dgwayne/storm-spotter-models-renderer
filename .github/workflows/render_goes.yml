name: Render GOES satellite

# Rolling window of recent GOES satellite frames (IR / WV / Visible) for
# the app's satellite animation. Each run renders any frames in the last
# ~3 hours not already on R2 and rebuilds the manifest, so a delayed or
# skipped scheduled tick is harmlessly backfilled by the next one.
#
# Source: IEM's archived georeferenced CONUS GeoTIFFs (15-min cadence).
# Public repo => unlimited Actions minutes.

on:
  schedule:
    - cron: '3,18,33,48 * * * *'   # every 15 min, offset a few min past the slot
  workflow_dispatch:
    inputs:
      force_rerender:
        description: 'Re-render every frame in the window even if already on R2 (e.g. after a color-table change).'
        type: boolean
        default: false

concurrency:
  group: render-goes
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      R2_BUCKET: ${{ secrets.B2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
      FORCE_RERENDER: ${{ inputs.force_rerender && '1' || '' }}

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Restore micromamba binary (cache)
        id: mmbin
        uses: actions/cache/restore@v4
        with:
          path: ~/micromamba-bin/micromamba
          key: micromamba-bin-linux64-v1

      - name: Set up micromamba (gdal + rclone)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: goes
          create-args: >-
            python=3.11
            gdal
            rclone
          cache-environment: true
          init-shell: bash
          download-micromamba: ${{ steps.mmbin.outputs.cache-hit != 'true' }}
          micromamba-binary-path: ~/micromamba-bin/micromamba

      - name: Save micromamba binary (cache)
        if: steps.mmbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/micromamba-bin/micromamba
          key: micromamba-bin-linux64-v1

      - name: Configure rclone for Cloudflare R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Other
          region = us-west-004
          no_check_bucket = true
          access_key_id = ${{ secrets.B2_KEY_ID }}
          secret_access_key = ${{ secrets.B2_APP_KEY }}
          endpoint = ${{ secrets.B2_S3_ENDPOINT }}
          EOF

      - name: Render GOES frames
        run: python scripts/render_goes.py
