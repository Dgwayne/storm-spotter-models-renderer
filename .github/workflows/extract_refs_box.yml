name: REFS Box Probabilities

# REFS ensemble probabilities on the point-sounding column lattice, for the
# app's box meteogram (v1/soundings/refs/). See scripts/extract_refs_box.py.
#
# Dispatched hourly at :55 by the stp-models-cron Worker (slot B). Each sweep
# republishes the newest REFS cycle once it has more hours than the CDN copy,
# so a cycle fills in over ~2-3 h as NOAA publishes it. Stateless: a missed
# sweep only means the next one does more work.
#
# Fallback: Astrol runs the same script with --if-stale (dead-man timer) and
# only does work when this feed is stale. Freshness monitor line: REFSBOX.
# NO `schedule:` here on purpose (see extract_soundings.yml for why).

on:
  workflow_dispatch:

concurrency:
  group: refs-box
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      R2_BUCKET: ${{ secrets.B2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}

    defaults:
      run:
        shell: bash -el {0}    # activate the conda env for every step

    steps:
      - uses: actions/checkout@v4

      - name: Restore micromamba binary (cache)
        id: mmbin
        uses: actions/cache/restore@v4
        with:
          path: ~/micromamba-bin/micromamba
          key: micromamba-bin-linux64-v1

      - name: Set up micromamba (gdal + rclone + python)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: soundings
          create-args: >-
            python=3.11
            gdal
            libgdal-grib
            rclone
            timezonefinder
          cache-environment: true
          init-shell: bash
          download-micromamba: ${{ steps.mmbin.outputs.cache-hit != 'true' }}
          micromamba-binary-path: ~/micromamba-bin/micromamba

      - name: Save micromamba binary (cache)
        if: steps.mmbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/micromamba-bin/micromamba
          key: micromamba-bin-linux64-v1

      - name: Configure rclone for Cloudflare R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Other
          region = us-west-004
          no_check_bucket = true
          access_key_id = ${{ secrets.B2_KEY_ID }}
          secret_access_key = ${{ secrets.B2_APP_KEY }}
          endpoint = ${{ secrets.B2_S3_ENDPOINT }}
          EOF

      - name: Extract REFS box probabilities
        run: python3 scripts/extract_refs_box.py
