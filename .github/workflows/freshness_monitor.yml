# Dead-man's switch for the whole render pipeline.
#
# Every render workflow is dispatched by the stp-models-cron Cloudflare
# Worker, whose documented failure mode is SILENT (Cloudflare stops firing
# the cron triggers while HTTP keeps working — hit 2026-07-13 and again for
# GOES on GitHub-native cron 2026-07-17). When that happens nothing errors;
# manifests just quietly age. This monitor is the independent observer: it
# checks the public manifests' generatedAt and FAILS the job when one is
# stale, which makes GitHub email the repo owner.
#
# Deliberately runs on GitHub's native schedule: it must not share the
# Cloudflare Worker's fate. Native cron is best-effort (fires roughly
# hourly in practice), which is fine for a dead-man's switch — the 120-min
# limit already allows for skipped ticks, and the previous stall went ~16 h
# unnoticed.
#
# It watches TWO failure classes:
#   1. STALENESS  — generatedAt stops advancing (dead scheduler / failing render).
#   2. MISSING Cache-Control — an object stops sending its own cache header.
# (2) exists because the zone's "Cache JSON feeds" cache rule now carries
# Edge TTL = "use cache-control header if present, BYPASS cache if not"
# (added 2026-08-15 after a lightning edge-pin served a 100-min-old feed
# while the origin was 6 s fresh). That setting makes a missing header
# fail SAFE for correctness but EXPENSIVE for cost: instead of the old ~4 h
# edge pin, the object stops being cached at all and every user request
# falls through to B2. The lightning feed alone is ~900 KB polled every
# 10 s per user, so a dropped `--header-upload` on a busy day is the
# difference between cents and ~$100/month. Nothing else would catch it —
# the data would look perfectly fresh the whole time.
name: Freshness monitor

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check manifest freshness
        run: |
          set -u
          fail=0
          check() {
            local name="$1" url="$2" max_min="$3"
            # Cache-bust: models.dgwaynes.com edge-caches manifest.json
            # (Cache-Control max-age=14400) — a cached copy could false-alarm.
            local meta
            meta=$(curl -sf --max-time 30 -H "Cache-Control: no-cache" \
                  "$url?_mon=$(date +%s)" \
                  | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('runs'); print(d['generatedAt'], len(r) if isinstance(r, list) else -1)") || {
              echo "::error::$name manifest fetch/parse failed"
              fail=1
              return
            }
            local gen="${meta% *}" runs="${meta##* }"
            local age=$(( ( $(date -u +%s) - $(date -u -d "$gen" +%s) ) / 60 ))
            echo "$name: generatedAt=$gen age=${age}m runs=${runs} (limit ${max_min}m)"
            if [ "$age" -gt "$max_min" ]; then
              echo "::error::$name manifest is ${age} min old (limit ${max_min} min) — check the stp-models-cron Worker (a 'wrangler deploy' from cron-trigger/ re-arms a stalled scheduler)"
              fail=1
            fi
            # An EMPTY runs list with a fresh generatedAt is the UKV/CAMSEU
            # failure class: every om sweep touches the manifest even when it
            # renders nothing, so an empty model looks alive on age alone
            # (UKV sat blank 6 days; CAMS-EU never rendered a frame). runs=-1
            # means this manifest schema has no runs list — not checked.
            if [ "$runs" = "0" ]; then
              echo "::error::$name manifest has ZERO runs — model publishes an empty catalog while generatedAt stays fresh; check the model's render job log for per-frame failures"
              fail=1
            fi
          }
          # Assert the object still sends its OWN Cache-Control (see the
          # header comment for why a missing one now costs money).
          check_cc() {
            local name="$1" url="$2"
            # The `?_cc=` query is load-bearing, not just cache-busting: a
            # BARE *.json URL matches the "Cache JSON feeds" rule, whose
            # browser-TTL rewrite returns max-age=14400 for EVERY object and
            # would mask a missing origin header. Adding a query stops the
            # URI matching that wildcard, so this reads the true origin
            # header — the same value the cache rule itself keys on.
            local hdrs
            hdrs=$(curl -fsS --max-time 30 -o /dev/null -D - \
                   "$url?_cc=$(date +%s)") || {
              echo "::error::$name Cache-Control probe: fetch failed"
              fail=1
              return
            }
            local cc
            cc=$(printf '%s' "$hdrs" | tr -d '\r' \
                 | grep -i '^cache-control:' | head -1)
            if [ -z "$cc" ]; then
              echo "::error::$name sends NO origin Cache-Control — Cloudflare will now BYPASS cache for it, so every user request hits B2. Restore the '--header-upload Cache-Control: public, max-age=N' on this object's upload in the renderer."
              fail=1
              return
            fi
            echo "$name ${cc#*:}"
          }
          check SAT  "https://models.dgwaynes.com/v1/SAT/manifest.json"  120
          # OBS is 20, not the standard 120, because it no longer renders
          # here — it is the always-on box (deploy/vps/), whose fast tier
          # touches generatedAt every 2 minutes. 120 was calibrated against a
          # 15-minute sweep, where it meant a handful of missed ticks; against
          # a 2-minute pipeline it is sixty of them, so a dead box could sit
          # unnoticed for two hours on the freshest feed in the app. 20 leaves
          # room for a slow tick or a brief network stall without crying wolf.
          #
          # This check deliberately stays on Actions: a watchdog hosted on the
          # thing it watches cannot report that thing being down.
          check OBS  "https://models.dgwaynes.com/v1/OBS/manifest.json"  20
          check HRRR "https://models.dgwaynes.com/v1/HRRR/manifest.json" 120
          # ICON-D2 (om-source pilot): rides the :7/:37 Worker slot, so a
          # healthy sweep touches generatedAt every ~30 min regardless of
          # whether Open-Meteo has a new run. 120 = the standard limit.
          check ICOND2 "https://models.dgwaynes.com/v1/ICOND2/manifest.json" 120
          # Batch-2 om models (render_om_models.yml matrix, same slot).
          # Every sweep's bootstrap manifest touches generatedAt, so 120
          # holds even for the 12-h-cycle GDPS.
          # 180 not 120: these ride a max-parallel-capped matrix, and under
          # cold-start/backfill congestion a model's job can queue past 2 h
          # while the scheduler is perfectly healthy (2026-08-14 morning:
          # UKMO hit 141 m and emailed; the data pipeline was fine). The
          # monitor detects DEAD schedulers, not per-model latency SLAs.
          check NBM    "https://models.dgwaynes.com/v1/NBM/manifest.json"    180
          check AIGFS  "https://models.dgwaynes.com/v1/AIGFS/manifest.json"  180
          check GFS013 "https://models.dgwaynes.com/v1/GFS013/manifest.json" 180
          check UKMO   "https://models.dgwaynes.com/v1/UKMO/manifest.json"   180
          check GDPS   "https://models.dgwaynes.com/v1/GDPS/manifest.json"   180
          check HGEFS  "https://models.dgwaynes.com/v1/HGEFS/manifest.json"  180
          # Batch-3 om models dispatch HOURLY (:37 only — 13 parallel
          # jobs vs the 20-runner cap), so one queued-out tick already
          # means a 2 h generatedAt gap. 180 absorbs exactly one missed
          # tick and still catches a dead scheduler.
          # 240 not 180: hourly dispatch + max-parallel 4-5 across 25 jobs
          # means a healthy model can legitimately go ~3 h between manifest
          # touches whenever backfills hog the queue (the 2026-08-14 spam:
          # UKV 324 m, JMAMSM 209 m, METNO 210 m — every one self-healed).
          # A dead Worker still trips this within 4 h on every model at once.
          for m in ICON ICONEU AROMEFR ARPEGE ARPEGEEU ICON2I AROMEAT JMAMSM JMAGSM CMA GFSWAVE ECMWFWAM GWAM \
                   HRDPS RDPS KNMIHAR DMIHAR UKV ALADIN ICONCH1 ICONCH2 METNO AROMEHD CAMSEU CAMSGL; do
            check "$m" "https://models.dgwaynes.com/v1/$m/manifest.json" 240
          done
          # Sub-hourly om models (render_om_15min.yml, dispatched :10/:40).
          # TIGHTENED 120 -> 45 on 2026-08-17. The standard 120 was far too
          # loose for models whose entire product is 15-minute frames: on
          # 2026-08-17 every one of this workflow's last eight runs was
          # cancelled by runner starvation, leaving HRRR15 at 45 min and
          # AROMEFR15 at 77 min stale, and the monitor sat green through all
          # of it. Healthy is 3-13 min (measured), so 45 has ample margin
          # over normal queue delay while still catching starvation.
          check HRRR15    "https://models.dgwaynes.com/v1/HRRR15/manifest.json"    45
          check AROMEFR15 "https://models.dgwaynes.com/v1/AROMEFR15/manifest.json" 45
          check RAP       "https://models.dgwaynes.com/v1/RAP/manifest.json"       120
          check HREFPMMN  "https://models.dgwaynes.com/v1/HREFPMMN/manifest.json"  240
          check HREFPROB  "https://models.dgwaynes.com/v1/HREFPROB/manifest.json"  240
          # GeoColor writes its OWN manifest, so a SAT/manifest.json check
          # says nothing about it. That gap let render_goes_geocolor.yml sit
          # on throttled GitHub-native cron until a user noticed night
          # imagery at 9:30 am local (2026-07-28).
          check GEOCOLOR "https://models.dgwaynes.com/v1/SAT/geocolor.json" 120
          # Soundings refresh hourly (:35 Worker dispatch); even a no-op run
          # touches generatedAt, so a stale manifest means missed dispatches
          # or failing extracts — not a late NOAA run. 180 = one missed hour
          # + a full ~25-min extract + slack.
          check SOUNDINGS "https://models.dgwaynes.com/v1/soundings/manifest.json" 180
          check SOUNDGFS  "https://models.dgwaynes.com/v1/soundings/gfs/manifest.json" 600
          # Wildfire rides the :00/:15/:30/:45 Worker slot with an hourly
          # GitHub-native backstop, so a healthy feed is never over ~60 min
          # old even with the Worker down. 120 = one missed hourly backstop
          # plus slack, which is what distinguishes "both schedulers are
          # dead" from "one tick was skipped".
          #
          # Worth monitoring despite being a small feed: unlike the model
          # renders, this one has an upstream that actively throttles us
          # (NIFC's ArcGIS enforces an org-wide request-unit quota and
          # answers 429 inside an HTTP 200 body), so it can fail in ways
          # the render workflows cannot.
          check WILDFIRE "https://models.dgwaynes.com/wildfire/v1/current.json" 120
          # Lightning rebuilds every ~15-20 s; the cron Worker's dead-man
          # re-dispatches it within ~5 min of a stall, so 30 min stale here
          # means BOTH recovery layers failed — email the owner.
          check LIGHTNING "https://models.dgwaynes.com/lightning/v1/flashes.json" 30

          # ── Cache-Control assertions ──────────────────────────────────
          # Scoped to the objects where losing the header would actually
          # cost real money: size x poll rate. Lightning first (~900 KB
          # every 10 s per user = by far the biggest exposure), then the
          # manifests the app polls on tab open, then the slower feeds.
          # Every one of these was verified sending a header on
          # 2026-08-15; this asserts it stays that way.
          echo "--- origin Cache-Control ---"
          check_cc LIGHTNING  "https://models.dgwaynes.com/lightning/v1/flashes.json"
          check_cc HRRR       "https://models.dgwaynes.com/v1/HRRR/manifest.json"
          check_cc OBS        "https://models.dgwaynes.com/v1/OBS/manifest.json"
          check_cc SAT        "https://models.dgwaynes.com/v1/SAT/manifest.json"
          check_cc GEOCOLOR   "https://models.dgwaynes.com/v1/SAT/geocolor.json"
          check_cc WILDFIRE   "https://models.dgwaynes.com/wildfire/v1/current.json"
          check_cc AIRQUALITY "https://models.dgwaynes.com/airquality/v1/conus.json"
          check_cc WIND       "https://models.dgwaynes.com/wind/v1/latest.json"
          exit $fail
