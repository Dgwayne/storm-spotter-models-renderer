# Dead-man's switch for the whole render pipeline.
#
# Every render workflow is dispatched by the stp-models-cron Cloudflare
# Worker, whose documented failure mode is SILENT (Cloudflare stops firing
# the cron triggers while HTTP keeps working — hit 2026-07-13 and again for
# GOES on GitHub-native cron 2026-07-17). When that happens nothing errors;
# manifests just quietly age. This monitor is the independent observer: it
# checks the public manifests' generatedAt and FAILS the job when one is
# stale, which makes GitHub email the repo owner.
#
# Deliberately runs on GitHub's native schedule: it must not share the
# Cloudflare Worker's fate. Native cron is best-effort (fires roughly
# hourly in practice), which is fine for a dead-man's switch — the 120-min
# limit already allows for skipped ticks, and the previous stall went ~16 h
# unnoticed.
name: Freshness monitor

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check manifest freshness
        run: |
          set -u
          fail=0
          check() {
            local name="$1" url="$2" max_min="$3"
            # Cache-bust: models.dgwaynes.com edge-caches manifest.json
            # (Cache-Control max-age=14400) — a cached copy could false-alarm.
            local gen
            gen=$(curl -sf --max-time 30 -H "Cache-Control: no-cache" \
                  "$url?_mon=$(date +%s)" \
                  | python3 -c "import json,sys; print(json.load(sys.stdin)['generatedAt'])") || {
              echo "::error::$name manifest fetch/parse failed"
              fail=1
              return
            }
            local age=$(( ( $(date -u +%s) - $(date -u -d "$gen" +%s) ) / 60 ))
            echo "$name: generatedAt=$gen age=${age}m (limit ${max_min}m)"
            if [ "$age" -gt "$max_min" ]; then
              echo "::error::$name manifest is ${age} min old (limit ${max_min} min) — check the stp-models-cron Worker (a 'wrangler deploy' from cron-trigger/ re-arms a stalled scheduler)"
              fail=1
            fi
          }
          check SAT  "https://models.dgwaynes.com/v1/SAT/manifest.json"  120
          check OBS  "https://models.dgwaynes.com/v1/OBS/manifest.json"  120
          check HRRR "https://models.dgwaynes.com/v1/HRRR/manifest.json" 120
          # GeoColor writes its OWN manifest, so a SAT/manifest.json check
          # says nothing about it. That gap let render_goes_geocolor.yml sit
          # on throttled GitHub-native cron until a user noticed night
          # imagery at 9:30 am local (2026-07-28).
          check GEOCOLOR "https://models.dgwaynes.com/v1/SAT/geocolor.json" 120
          # Soundings refresh hourly (:35 Worker dispatch); even a no-op run
          # touches generatedAt, so a stale manifest means missed dispatches
          # or failing extracts — not a late NOAA run. 180 = one missed hour
          # + a full ~25-min extract + slack.
          check SOUNDINGS "https://models.dgwaynes.com/v1/soundings/manifest.json" 180
          # Wildfire rides the :00/:15/:30/:45 Worker slot with an hourly
          # GitHub-native backstop, so a healthy feed is never over ~60 min
          # old even with the Worker down. 120 = one missed hourly backstop
          # plus slack, which is what distinguishes "both schedulers are
          # dead" from "one tick was skipped".
          #
          # Worth monitoring despite being a small feed: unlike the model
          # renders, this one has an upstream that actively throttles us
          # (NIFC's ArcGIS enforces an org-wide request-unit quota and
          # answers 429 inside an HTTP 200 body), so it can fail in ways
          # the render workflows cannot.
          check WILDFIRE "https://models.dgwaynes.com/wildfire/v1/current.json" 120
          exit $fail
