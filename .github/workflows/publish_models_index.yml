name: Publish models index

on:
  push:
    branches: [main]
    paths:
      - config/products.yml
      - scripts/build_models_index.py
  workflow_dispatch:

concurrency:
  group: publish-models-index
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_BUCKET: ${{ secrets.B2_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - name: Restore rclone (cache)
        id: rclonecache
        uses: actions/cache/restore@v4
        with:
          path: ~/.tools/rclone
          key: rclone-v1.68.2-linux-amd64

      - name: Install deps (pyyaml + modern rclone)
        # Ubuntu 24.04's apt rclone is 1.60, which still sends the canned
        # ACL `private` that B2's S3 layer 400s (the documented b2
        # migration gotcha). Pin a modern binary, cached per the CI
        # download-hardening pattern.
        run: |
          set -e
          python3 -m pip install --no-input pyyaml
          if [ ! -x "$HOME/.tools/rclone" ]; then
            mkdir -p "$HOME/.tools"
            curl -sSfL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 120 \
              -o /tmp/rclone.zip \
              https://github.com/rclone/rclone/releases/download/v1.68.2/rclone-v1.68.2-linux-amd64.zip
            unzip -q -j /tmp/rclone.zip -d "$HOME/.tools" rclone-v1.68.2-linux-amd64/rclone
          fi
          sudo install -m 0755 "$HOME/.tools/rclone" /usr/local/bin/rclone
          rclone --version | head -1

      - name: Save rclone (cache)
        if: steps.rclonecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.tools/rclone
          key: rclone-v1.68.2-linux-amd64

      - name: Configure rclone for B2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Other
          region = us-west-004
          no_check_bucket = true
          access_key_id = ${{ secrets.B2_KEY_ID }}
          secret_access_key = ${{ secrets.B2_APP_KEY }}
          endpoint = ${{ secrets.B2_S3_ENDPOINT }}
          EOF

      - name: Build + upload models.json
        run: python3 scripts/build_models_index.py
