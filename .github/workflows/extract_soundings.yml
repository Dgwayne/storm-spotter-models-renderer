name: Extract Soundings

# Pull the HRRR analysis wind profile (UGRD/VGRD/HGT at mandatory levels)
# for every CONUS NEXRAD site and upload one tiny JSON per site to R2 at
# v1/soundings/<SITE>.json. The Storm Spotter velocity dealiaser uses these
# as a trusted reference wind to unfold aliased Doppler velocity.
#
# Runs hourly: dispatched at :35 by the stp-models-cron Cloudflare Worker
# (cron-trigger/ — HRRR f18 for the previous hour's cycle publishes ~:15-:30,
# so :35 catches each new complete run minutes after it lands). The GitHub
# schedule below is the decorative/fallback cron only; GitHub-native cron is
# throttled and unreliable (see CRON_TO_WORKFLOW in cron-trigger/src/worker.js).
# find_latest_run() looks back up to 8 hours, so a late NOAA run just means
# falling back to the previous complete one, and the script no-ops (manifest
# touch only) when the CDN already serves the newest run.

on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:

concurrency:
  group: extract-soundings
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      R2_BUCKET: ${{ secrets.B2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}

    defaults:
      run:
        shell: bash -el {0}    # activate the conda env for every step

    steps:
      - uses: actions/checkout@v4

      - name: Restore micromamba binary (cache)
        id: mmbin
        uses: actions/cache/restore@v4
        with:
          path: ~/micromamba-bin/micromamba
          key: micromamba-bin-linux64-v1

      - name: Set up micromamba (gdal + rclone + python)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: soundings
          create-args: >-
            python=3.11
            gdal
            libgdal-grib
            rclone
            timezonefinder
          cache-environment: true
          init-shell: bash
          download-micromamba: ${{ steps.mmbin.outputs.cache-hit != 'true' }}
          micromamba-binary-path: ~/micromamba-bin/micromamba

      - name: Save micromamba binary (cache)
        if: steps.mmbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/micromamba-bin/micromamba
          key: micromamba-bin-linux64-v1

      - name: Configure rclone for Cloudflare R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Other
          region = us-west-004
          no_check_bucket = true
          access_key_id = ${{ secrets.B2_KEY_ID }}
          secret_access_key = ${{ secrets.B2_APP_KEY }}
          endpoint = ${{ secrets.B2_S3_ENDPOINT }}
          EOF

      - name: Extract soundings
        run: python3 scripts/extract_soundings.py
