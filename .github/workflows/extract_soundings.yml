name: Extract Soundings

# Pull the HRRR analysis wind profile (UGRD/VGRD/HGT at mandatory levels)
# for every CONUS NEXRAD site and upload one tiny JSON per site to R2 at
# v1/soundings/<SITE>.json. The Storm Spotter velocity dealiaser uses these
# as a trusted reference wind to unfold aliased Doppler velocity.
#
# Runs hourly a few minutes before the top of the hour: find_latest_run()
# looks back up to 6 hours, so even when the freshest run's f00 hasn't
# published yet it falls back to the previous (always-available) run. The
# environmental wind changes slowly, so a profile up to ~1 h old is fine.

on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:

concurrency:
  group: extract-soundings
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    defaults:
      run:
        shell: bash -el {0}    # activate the conda env for every step

    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba (gdal + rclone + python)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: soundings
          create-args: >-
            python=3.11
            gdal
            libgdal-grib
            rclone
            timezonefinder
          cache-environment: true
          init-shell: bash

      - name: Configure rclone for Cloudflare R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          EOF

      - name: Extract soundings
        run: python3 scripts/extract_soundings.py
