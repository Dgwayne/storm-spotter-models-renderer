# Canonical product catalog for storm-spotter-models-renderer.
#
# Each product has:
#   wgrib2_match:   regex passed to `wgrib2 -match` to select the GRIB message(s)
#   units_in:       native GRIB units (for documentation / sanity)
#   units_out:      display units after gdal/wgrib2 conversion
#   convert:        optional gdal_calc expression to convert raw -> display units
#                   placeholders: A = raw value
#                   (left blank = identity; gdaldem ramps work on raw values then)
#   clr:            color table file under config/color_tables/
#   pal:            matching .pal asset name (for the Flutter app)
#   display:        human-readable name shown in the model picker
#   point_values:   when true, publish a per-frame F###.json value grid next to
#                   the PNG (sample_point_values.py) for on-map numbers
#   point_decimals: decimals to keep in the published values (default 0)
#
# Models declare which products they publish in the `models:` map at the bottom.

products:
  refc:
    display: "Composite Reflectivity"
    # No trailing colon: HRRR/GFS idx lines say ":REFC:entire atmosphere:"
    # but RRFS writes ":REFC:entire atmosphere (considered as a single
    # layer):" — the prefix matches all three, still a single message each.
    wgrib2_match: ":REFC:entire atmosphere"
    units_in: "dBZ"
    units_out: "dBZ"
    convert: ""
    clr: "refc.clr"
    pal: "hrrr_refc.pal"
    # Smooth, interpolated color gradient (no -nearest_color_entry) so
    # reflectivity renders like RadarOmega instead of hard 5-dBZ bands.
    # All other products omit this flag and keep crisp binned colors.
    interpolate_color: true

  t2m:
    display: "2m Temperature"
    wgrib2_match: ":TMP:2 m above ground:"
    # GRIB encodes Kelvin per WMO convention, but GDAL's GRIB driver
    # auto-normalizes temperature to Celsius on read (per the GRIB
    # CF-conformance defaults). Convert Celsius -> Fahrenheit so the
    # .clr ramp (keyed in degF) lines up with the actual data.
    units_in: "C"
    units_out: "degF"
    convert: "A * 1.8 + 32"
    clr: "t2m.clr"
    pal: "hrrr_t2m.pal"
    point_values: true
    # also_meso: publish in the manifest's mesoCatalog too — the app's
    # Mesoanalysis layer lists this product (its f00 frame already
    # renders for the models tab, so reuse costs nothing).
    also_meso: true

  td2m:
    display: "2m Dewpoint"
    wgrib2_match: ":DPT:2 m above ground:"
    # GDAL auto-normalizes K -> C, same as t2m. See note there.
    units_in: "C"
    units_out: "degF"
    convert: "A * 1.8 + 32"
    clr: "td2m.clr"
    pal: "hrrr_td2m.pal"
    point_values: true
    also_meso: true

  wind10m:
    display: "10m Wind Speed"
    # Special: this product needs UGRD + VGRD combined into magnitude.
    # Handled with two-pass wgrib2 + gdal_calc; see decode_pipeline.sh.
    wgrib2_match: ":(UGRD|VGRD):10 m above ground:"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "hrrr_wind10m.pal"
    point_values: true
    also_meso: true

  gust10m:
    display: "10m Wind Gust"
    wgrib2_match: ":GUST:surface:"
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "hrrr_gust10m.pal"
    point_values: true
    also_meso: true

  mslp:
    display: "Mean Sea-Level Pressure"
    # HRRR uses MSLMA, NAM uses MSLET, GFS uses PRMSL.
    wgrib2_match: ":(MSLMA|MSLET|PRMSL):mean sea level:"
    units_in: "Pa"
    units_out: "hPa"
    convert: "A / 100.0"
    clr: "mslp.clr"
    pal: "hrrr_mslp.pal"
    point_values: true

  sfccape:
    display: "Surface CAPE"
    wgrib2_match: ":CAPE:surface:"
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cape.clr"
    pal: "hrrr_sfccape.pal"
    point_values: true
    also_meso: true

  precip1h:
    display: "1-hour Precipitation"
    # 1-hour bucket ending at the current fh: "(fh-1)-fh hour acc".
    # decode_pipeline.sh substitutes {fh} and {fh_minus_1} before matching.
    wgrib2_match: ":APCP:surface:{fh_minus_1}-{fh} hour acc"
    units_in: "kg/m^2"
    units_out: "in"
    convert: "A / 25.4"
    clr: "precip.clr"
    pal: "hrrr_precip1h.pal"
    point_values: true
    point_decimals: 2

  wind500:
    display: "500mb Wind Speed"
    wgrib2_match: ":(UGRD|VGRD):500 mb:"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "gfs_wind500.pal"
    point_values: true

  precipTotal:
    display: "Total Precipitation"
    wgrib2_match: ":APCP:surface:0-"
    units_in: "kg/m^2"
    units_out: "in"
    convert: "A / 25.4"
    clr: "precip.clr"
    pal: "gfs_precipTotal.pal"
    point_values: true
    point_decimals: 2

  # ── Mesoanalysis products ────────────────────────────────────────────────
  # Analysis-hour severe-weather parameters for the app's Mesoanalysis map
  # layer (SPC-mesoanalysis-style shaded fields under radar).
  #
  #   fh_cap: 1     render only f00 (the analysis) + f01 (bridge frame while
  #                 the next run's f00 is still publishing). Keeps the added
  #                 render cost to ~18 frames/hour instead of doubling ticks.
  #   category: meso  build_manifest.py publishes these in a separate
  #                 `mesoCatalog` so app versions that predate the meso layer
  #                 never see them in the Weather Models picker.
  #
  # Derived products (stp, scp) set `derived: true` with named `inputs`
  # (letter -> idx match regex, one message each) and a gdal_calc `calc`
  # expression over those letters. Formulas are kept EXACTLY in sync with
  # the app's sounding_analysis.dart (_stpFixed / _scp) so a tapped map
  # value never disagrees with the sounding sheet at the same point:
  #   * STP includes Thompson's CIN term (the app's deliberate choice) —
  #     values run lower than SPC's fixed-layer STP wherever SBCIN < -50.
  #   * SCP uses SRH3/BWD6 (the app's fallback when effective-layer values
  #     are unavailable).

  mlcape:
    display: "MLCAPE"
    wgrib2_match: ":CAPE:90-0 mb above ground:"
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cape.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  mucape:
    display: "MUCAPE"
    wgrib2_match: ":CAPE:255-0 mb above ground:"
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cape.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  mlcin:
    display: "MLCIN"
    wgrib2_match: ":CIN:90-0 mb above ground:"
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cin.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  srh1:
    display: "0-1km SRH"
    wgrib2_match: ":HLCY:1000-0 m above ground:"
    units_in: "m^2/s^2"
    units_out: "m²/s²"
    convert: ""
    clr: "srh.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  srh3:
    display: "0-3km SRH"
    wgrib2_match: ":HLCY:3000-0 m above ground:"
    units_in: "m^2/s^2"
    units_out: "m²/s²"
    convert: ""
    clr: "srh.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  shear6:
    display: "0-6km Shear"
    # ⚠ HRRR labels VUCSH/VVCSH as [1/s] but the encoded values are the
    # bulk wind-difference vector components in m/s (verified empirically
    # 2026-07-08: magnitudes 0-35 with p99 ≈ 23 — true shear-per-second
    # would be ~0.005). Treat exactly like a U/V wind pair.
    wgrib2_match: ":(VUCSH|VVCSH):0-6000 m above ground:"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "shear.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  stp:
    display: "Sig. Tornado (STP)"
    derived: true
    # Mirrors sounding_analysis.dart _stpFixed (STP-cin variant):
    #   capeTerm  = SBCAPE/1500
    #   lclTerm   = clip((2000 - LCL_agl)/1000, 0, 1)   LCL_agl = LCL_msl - terrain
    #   srhTerm   = SRH1/150
    #   shearTerm = 0 below 12.5 m/s, else min(shr6,30)/20  (cap 1.5)
    #   cinTerm   = clip((200 + SBCIN)/150, 0, 1)        (SBCIN is negative)
    inputs:
      A: ":CAPE:surface:"
      B: ":CIN:surface:"
      C: ":HGT:level of adiabatic condensation from sfc:"
      D: ":HGT:surface:"
      E: ":HLCY:1000-0 m above ground:"
      F: ":VUCSH:0-6000 m above ground:"
      G: ":VVCSH:0-6000 m above ground:"
    calc: "maximum((A/1500.0)*clip((2000.0-(C-D))/1000.0,0,1)*(E/150.0)*where(sqrt(F*F+G*G)<12.5,0,minimum(sqrt(F*F+G*G),30.0)/20.0)*clip((200.0+B)/150.0,0,1),0)"
    units_in: ""
    units_out: ""
    convert: ""
    clr: "stp.clr"
    pal: ""
    point_values: true
    point_decimals: 1
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  scp:
    display: "Supercell Comp. (SCP)"
    derived: true
    # Mirrors sounding_analysis.dart _scp with the SRH3/BWD6 fallback:
    #   (MUCAPE/1000) * (SRH3/50) * shearTerm
    #   shearTerm = 0 below 10 m/s, else min(shr6,20)/20  (cap 1.0)
    inputs:
      A: ":CAPE:255-0 mb above ground:"
      B: ":HLCY:3000-0 m above ground:"
      C: ":VUCSH:0-6000 m above ground:"
      D: ":VVCSH:0-6000 m above ground:"
    calc: "maximum((A/1000.0)*(B/50.0)*where(sqrt(C*C+D*D)<10.0,0,minimum(sqrt(C*C+D*D),20.0)/20.0),0)"
    units_in: ""
    units_out: ""
    convert: ""
    clr: "scp.clr"
    pal: ""
    point_values: true
    point_decimals: 1
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  # ── Mesoanalysis catalog v2 (SPC-style groups) ──────────────────────────
  # Same rules as the first meso set: fh_cap 1, category meso, formulas
  # kept dumb enough to audit against the SPC page. Grouping lives in the
  # app's kMesoParameters (Thermodynamics / Wind Shear / Composite Indices /
  # Surface / Heavy Rain / Winter Weather / Fire Weather).

  cape3km:
    display: "0-3km CAPE"
    wgrib2_match: ":CAPE:0-3000 m above ground:"
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cape3km.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  liftedIdx:
    display: "Lifted Index"
    # ⚠ LFTX is a temperature-typed field (K): if GDAL's CF normalization
    # subtracts 273.15 the raw stats will sit near -280 — check the logged
    # raw.tif stats on first render and add `convert: "A + 273.15"` if so.
    wgrib2_match: ":LFTX:500-1000 mb:"
    units_in: "K"
    units_out: "°C"
    convert: ""
    clr: "lifted.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  lapse75:
    display: "700-500mb Lapse Rate"
    derived: true
    # (T700 - T500) / (z500 - z700) in °C/km. Temperature DIFFERENCE, so
    # any K→C normalization by the GRIB driver cancels out. max() guards
    # a degenerate thickness (never happens on real data).
    inputs:
      A: ":TMP:700 mb:"
      B: ":TMP:500 mb:"
      C: ":HGT:500 mb:"
      D: ":HGT:700 mb:"
    calc: "(A-B)/maximum((C-D)/1000.0,0.1)"
    units_in: ""
    units_out: "°C/km"
    convert: ""
    clr: "lapse.clr"
    pal: ""
    point_values: true
    point_decimals: 1
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  lclHgt:
    display: "LCL Height"
    derived: true
    # LCL above ground = LCL MSL height minus terrain height.
    inputs:
      A: ":HGT:level of adiabatic condensation from sfc:"
      B: ":HGT:surface:"
    calc: "maximum(A-B,0)"
    units_in: "m"
    units_out: "m"
    convert: ""
    clr: "lcl.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  shear1:
    display: "0-1km Shear"
    # Same [1/s]-labeled-but-actually-m/s gotcha as shear6.
    wgrib2_match: ":(VUCSH|VVCSH):0-1000 m above ground:"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "shear1.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  stormMotion:
    display: "Storm Motion"
    # Bunkers right-mover storm motion vector -> speed. (Direction can't
    # render as a raster; the sounding hodograph covers it.)
    wgrib2_match: ":(USTM|VSTM):0-6000 m above ground:"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  ehi1:
    display: "EHI (0-1km)"
    derived: true
    # Energy-Helicity Index, mirrors sounding_analysis.dart _ehi:
    # (CAPE * SRH) / 160000, floored at 0.
    inputs:
      A: ":CAPE:surface:"
      B: ":HLCY:1000-0 m above ground:"
    calc: "maximum((A*B)/160000.0,0)"
    units_in: ""
    units_out: ""
    convert: ""
    clr: "ehi.clr"
    pal: ""
    point_values: true
    point_decimals: 1
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  pwat:
    display: "Precipitable Water"
    wgrib2_match: ":PWAT:entire atmosphere"
    units_in: "kg/m^2"
    units_out: "in"
    convert: "A / 25.4"
    clr: "pwat.clr"
    pal: ""
    point_values: true
    point_decimals: 2
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  echoTops:
    display: "Echo Tops"
    wgrib2_match: ":RETOP:cloud top:"
    units_in: "m"
    units_out: "kft"
    convert: "A * 0.00328084"
    clr: "etops.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  ptype:
    display: "Precip Type"
    derived: true
    # Categorical composite of HRRR's dominant-type 0/1 flags:
    # 1 rain, 2 snow, 3 sleet, 4 freezing rain. Rendered with the
    # default nearest-color mapping (discrete bins); no point values —
    # the numbers would be category codes, not measurements.
    #
    # fh_min: the categorical flags are ALL-ZERO at f00 (verified
    # 2026-07-08: f00 CRAIN nonzero=0, f01 nonzero=109k) — HRRR only
    # populates them on forecast hours. Render f01 only; the app's
    # meso layer follows each product's first expected hour.
    fh_min: 1
    inputs:
      A: ":CRAIN:surface:"
      B: ":CSNOW:surface:"
      C: ":CICEP:surface:"
      D: ":CFRZR:surface:"
    calc: "A*1+B*2+C*3+D*4"
    units_in: ""
    units_out: ""
    convert: ""
    clr: "ptype.clr"
    pal: ""
    point_values: false
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  frzLvl:
    display: "Freezing Level"
    wgrib2_match: ":HGT:0C isotherm:"
    units_in: "m"
    units_out: "m"
    convert: ""
    clr: "frzlvl.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  rh2m:
    display: "2m Relative Humidity"
    wgrib2_match: ":RH:2 m above ground:"
    units_in: "%"
    units_out: "%"
    convert: ""
    clr: "rh.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  vis:
    display: "Surface Visibility"
    wgrib2_match: ":VIS:surface:"
    units_in: "m"
    units_out: "mi"
    convert: "A / 1609.34"
    clr: "vis.clr"
    pal: ""
    point_values: true
    point_decimals: 1
    fh_cap: 1
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]
    category: meso

  # ── Observed precipitation (MRMS QPE) ───────────────────────────────────
  # Radar+gauge observed accumulation for the app's "Observations (Precip)"
  # map layer. NOT rendered by decode_pipeline.sh — these have no runs or
  # forecast hours; scripts/render_mrms_qpe.sh fetches the MRMS grib2
  # directly from the noaa-mrms-pds AWS bucket and publishes each valid
  # hour as a single-frame pseudo-run (RunStamp = accumulation END hour,
  # frame F000) so build_manifest.py / prune_old_runs.py / the app's
  # frame-fetch plumbing all work unchanged.
  #
  #   mrms_product: source directory prefix on noaa-mrms-pds (the script
  #                 appends _Pass2_00.00 / _Pass1_00.00).
  # MRMS QPE encodes mm with sentinel negatives (-1 missing, -3 outside
  # radar coverage) — the render script maps A<0 → NoData before mm→in.

  qpe01h:
    display: "1-hour Precip"
    mrms_product: "MultiSensor_QPE_01H"
    units_in: "mm"
    units_out: "in"
    clr: "qpe.clr"
    pal: ""
    group: "Precipitation"
    point_values: true
    point_decimals: 2
    point_grid: [512, 512]

  qpe03h:
    display: "3-hour Precip"
    mrms_product: "MultiSensor_QPE_03H"
    units_in: "mm"
    units_out: "in"
    clr: "qpe.clr"
    pal: ""
    group: "Precipitation"
    point_values: true
    point_decimals: 2
    point_grid: [512, 512]

  qpe06h:
    display: "6-hour Precip"
    mrms_product: "MultiSensor_QPE_06H"
    units_in: "mm"
    units_out: "in"
    clr: "qpe.clr"
    pal: ""
    group: "Precipitation"
    point_values: true
    point_decimals: 2
    point_grid: [512, 512]

  qpe12h:
    display: "12-hour Precip"
    mrms_product: "MultiSensor_QPE_12H"
    units_in: "mm"
    units_out: "in"
    clr: "qpe.clr"
    pal: ""
    group: "Precipitation"
    point_values: true
    point_decimals: 2
    point_grid: [512, 512]

  qpe24h:
    display: "24-hour Precip"
    mrms_product: "MultiSensor_QPE_24H"
    units_in: "mm"
    units_out: "in"
    clr: "qpe.clr"
    pal: ""
    group: "Precipitation"
    point_values: true
    point_decimals: 2
    point_grid: [512, 512]

  # ── MRMS observation catalog (render_mrms_obs.sh) ──────────────────
  # Latest-frame products: sub-hourly publishes (2-min radar mosaics,
  # 10-min FLASH) with arbitrary -HHMMSS stamps and NO Pass1/Pass2 cycle,
  # so these use `mrms_dir` (the full CONUS/ prefix) instead of
  # `mrms_product`, and render_mrms_obs.sh lists the S3 day dir and takes
  # the newest object. `scale` multiplies values AFTER the A<0 sentinel
  # mask (-1 missing / -3 no-coverage → NoData); products left at 1 pass
