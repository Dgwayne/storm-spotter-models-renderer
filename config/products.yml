    mrms_dir: "MESH_00.50"
    data_png: { min: 0.0, max: 5.0 }
    units_in: "mm"
    units_out: "in"
    scale: 0.0393701
    clr: "mesh.clr"
    pal: ""
    group: "Hail"
    point_values: true
    point_decimals: 2
    point_grid: [512, 512]

