    # MRMS CONUS grid coverage (lon 230.005-299.995E, lat 20.005-54.995N) —
    # narrower than the model CONUS box on the west edge; the app reads the
    # bbox from the manifest so overlay placement stays correct.
    bbox_lonlat: [-130.0, 20.0, -60.0, 55.0]
    # 4096 wide ≈ 1.9 km/px vs MRMS 1 km native — the crispness ceiling for
    # mobile GPU textures (max texture size ~4096). Unlike the models tab
    # there is NO animation scrubbing here (one static frame per range), so
    # the 2048 scrub-smoothness tradeoff doesn't apply. Height matches the
    # bbox's Web-Mercator aspect (70° lon / lat 20-55 → 0.6531).
    image_size: [4096, 2676]
    point_grid: [512, 512]
    forecast_hours_default: { start: 0, end: 0, step: 1 }
    s3_bucket: "noaa-mrms-pds"
    # Key template is informational — render_mrms_qpe.sh builds keys itself
    # (per-product prefix + Pass2/Pass1 fallback), it doesn't use decode_pipeline.sh.
    s3_key_template: "CONUS/{product}_Pass2_00.00/{date}/MRMS_{product}_Pass2_00.00_{date}-{run:02d}0000.grib2.gz"
    runs_per_day: 24
    # 26 hourly valid slots ≈ 24 h of history + slack — powers the app's
    # catalog playback loop (3/6/12/24-hr windows of hourly frames).
    retain_runs: 26

  RTMA:
    # RTMA surface-observation pseudo-model (render_rtma_obs.sh — NOT
    # decode_pipeline.sh). Each 2.5 km analysis publishes as its own
    # immutable run under a 12-digit YYYYMMDDHHMM stamp (Rapid-Update
    # cycles land every 15 min), because the app's frame disk-cache is
    # keyed by runStamp — see the script header for the full rationale.
    # forecast_hours 0-0 → expected set exactly [0], like OBS.
    products:
      - t2m
      - td2m
      - thetae
      - wind10m
      - gust10m
    # Same CONUS box as the forecast models / wind field so overlays line
    # up. 4096 wide ≈ 1.9 km/px vs RTMA 2.5 km native — single static
    # frame (no scrub), so the models-tab 2048 tradeoff doesn't apply;
    # height matches the bbox's Web-Mercator aspect (74° lon / lat 21-53).
    bbox_lonlat: [-134.0, 21.0, -60.0, 53.0]
    image_size: [4096, 2283]
    point_grid: [512, 512]
    forecast_hours_default: { start: 0, end: 0, step: 1 }
    s3_bucket: "noaa-rtma-pds"
    # Informational — render_rtma_obs.sh builds keys itself (RU-preferred
    # discovery with hourly fallback, mirroring wind_field.py).
    s3_key_template: "rtma2p5_ru.{date}/rtma2p5_ru.t{run:04d}z.2dvaranl_ndfd.grb2"
    # 96 RU analyses/day; retain 12 ≈ 3 h of history (the layer only ever
    # shows the newest — retention is just cold-start slack + debugging).
    runs_per_day: 96
    retain_runs: 12

  NAM:
    # NAM 3 km CONUS nest ("NAM NEST") — the chaser-standard day-2 CAM:
    # hourly output to f60 on all four cycles bridges HRRR's 18/48 h limit.
    # idx gotchas found on integration (2026-07-12):
    #   * U/V pairs are packed as SUBFIELD idx lines (624.1/624.2, one
    #     byte offset) — see compute_ranges in decode_pipeline.sh.
    #   * REFC uses the RRFS-style "(considered as a single layer)" text
    #     (prefix match already handles it).
    #   * APCP is 3-hour-reset buckets → precip3h with fh_step, and no
    #     running total → no precipTotal.
    # ⚠ NAM is slated for retirement after RRFS's operational cutover
    # (2026-08-31) — keep until NOAA actually stops publishing; symptom
    # will be runs silently going stale (idx HEAD 404s by design).
    products:
      - refc
      - refd1km
      - t2m
      - td2m
      - wind10m
      - gust10m
      - mslp
      - sfccape
      - sbcin
      - precip3h
      # 2026-08-05 expansion (Pivotal parity, mirrors HRRR where the
      # conusnest file carries the field — verified in the 12z f09 idx).
      # NOT here because the nest genuinely lacks them: cape3km, shear1
      # (no VUCSH 0-1000), asnow/frzr (no accum fields), smoke, SBT/irsat.
      # No precipTotal either (3-hour-reset buckets only — see precip3h).
      - tcc
      - lcc
      - mcc
      - hcc
      - ltng
      # Severe-parameter forecasts. The whole point of carrying these on NAM
      # is range: HRRR stops at f18 (f48 synoptic), NAM runs hourly to f60 on
      # every cycle, so this is the day-2 severe view. NAM has no `also_meso`
      # consequence worth worrying about — the app's Mesoanalysis layer reads
      # the HRRR manifest only.
      - srh1
      - srh3
      - ehi1
      - ehi3
      - uh25
      - mlcape
      - mucape
      - mlcin
      - shear6
      - stp
      - scp
      - liftedIdx
      - lapse75
      - lclHgt
      - stormMotion
      - pwat
      - echoTops
      - ptype
      - frzLvl
      - rh2m
      - vis
      - snod
    # Parallel render groups — same contract as HRRR's (plan job enforces
    # exact coverage of the products list).
    render_groups:
      core:     [refc, t2m, td2m, wind10m, gust10m, mslp, sfccape, precip3h]
      sky:      [tcc, lcc, mcc, hcc, refd1km]
      severe-a: [srh1, srh3, ehi1, ehi3, shear6, stormMotion, uh25]
      severe-b: [mlcape, mucape, mlcin, sbcin, liftedIdx, lapse75, lclHgt]
      hazards:  [stp, scp, ltng, ptype, frzLvl]
      enviro:   [pwat, echoTops, rh2m, vis, snod]
    # Same CONUS render box + raster size as HRRR/RRFS (3 km native; see
    # the HRRR image_size note for the 2048 scrub-smoothness tradeoff).
    bbox_lonlat: [-134.0, 21.0, -60.0, 53.0]
    image_size: [2048, 2048]
    point_grid: [128, 128]
    # All four cycles publish the full hourly f00-f60 range (verified
    # against the bucket 2026-07-12: f60 exists, f61 does not).
    forecast_hours_default: { start: 0, end: 60, step: 1 }
    s3_bucket: "noaa-nam-pds"
    s3_key_template: "nam.{date}/nam.t{run:02d}z.conusnest.hiresf{fh:02d}.tm00.grib2"
    runs_per_day: 4
    runs: [0, 6, 12, 18]
    retain_runs: 5

  ECMWF:
    # ECMWF IFS open data ("the Euro"), 0.25° global — data.ecmwf.int,
    # free under CC-BY-4.0 (attribution: "Contains modified ECMWF IFS
    # open data"). Not an AWS bucket: base_url + index_format switch the
    # fetch path in decode_pipeline.sh to the JSON .index files.
    # No simulated reflectivity in the open-data set — the catalog leads
    # with MUCAPE instead.
    # Publish latency is long (~7-9 h after init; 00z today was still 404
    # at 07Z) — the newest-cycle sweep just idx-404s until it lands.
    # Steps continue 6-hourly past f144 (to f240+); the manifest models
    # expected hours as one uniform range, so we cap at f144 / 3-hourly.
    products:
      - capeMU
      - t2m
      - td2m
      - wind10m
      - gust10m
      - mslp
      - precipTotalM
      # Full pressure-level wind ladder (2026-08-06) — the open-data index
      # publishes u/v at every one of these levels (verified). tcc is NOT
      # here yet: ECMWF may encode it as a 0-1 fraction vs everyone
      # else's %, so it needs a units check before joining the shared
      # entry (or a fraction-converting twin like precipTotalM).
      - wind925
      - wind850
      - wind700
      - wind500
      - wind300
      - wind250
      - wind200
    # Global grid; render the same CONUS box as the other models for
    # app-side overlay parity (a GLOBAL entry can come later).
    bbox_lonlat: [-134.0, 21.0, -60.0, 53.0]
    # 0.25° ≈ 22 km native — 1024 px over 74° lon matches GFS.
    image_size: [1024, 1024]
    point_grid: [128, 128]
    forecast_hours_default: { start: 0, end: 144, step: 3 }
    # oper stream = 00z and 12z only (06/18z live in the separate scda
    # stream with a 90 h range — not worth a second key template in v1).
    base_url: "https://data.ecmwf.int/forecasts"
    index_format: "ecmwf"
    s3_key_template: "{date}/{run:02d}z/ifs/0p25/oper/{date}{run:02d}0000-{fh}h-oper-fc.grib2"
    runs_per_day: 2
    runs: [0, 12]
    retain_runs: 4

  GFS:
    # 2026-08-06 expansion (Pivotal parity) — verified against the 12z
    # f000/f009/f012 pgrb2.0p25 idx. GFS genuinely lacks: HLCY 1000-0
    # (no srh1/ehi1), MXUPHL (no uh25), VUCSH (no shear1/shear6/scp),
    # the LCL-height message (no lclHgt/stp), LTNG, smoke, SBT, cape3km,
    # ASNOW/FRZR (snow depth only). TCDC/LCDC etc. publish instantaneous
    # + period-ave pairs — the instantaneous message sorts first, so the
    # anchored prefix + `-b 1` picks it, same as RRFS.
    products:
      - refc
      - refd1km
      - t2m
      - td2m
      - wind10m
      - gust10m
      - mslp
      - sfccape
      - sbcin
      - precip6h
      - precipTotal
      - tcc
      - lcc
      - mcc
      - hcc
      - ptype
      - srh3
      - ehi3
      - mlcape
      - mucape
      - mlcin
      - liftedIdx
      - lapse75
      - stormMotion
      - pwat
      - frzLvl
      - rh2m
      - vis
      - snod
      # Upper-air suite (2026-08-06 round 2): full wind ladder, RH,
      # dynamics, and the derived sfc-500mb bulk shear.
      - shearSfc500
      - wind925
      - wind850
      - wind700
      - wind500
      - wind300
      - wind250
      - wind200
      - rh925
      - rh850
      - rh700
      - rh500
      - vort500
      - vv700
    # Parallel render groups — same contract as HRRR's (plan job enforces
    # exact coverage). 1024² global-grid frames are ~4x cheaper than the
    # 3 km CONUS models', so groups can run a little wider.
    render_groups:
      core:       [refc, t2m, td2m, wind10m, gust10m, mslp, sfccape, precipTotal]
      sky:        [tcc, lcc, mcc, hcc, refd1km]
      severe:     [srh3, ehi3, mlcape, mucape, mlcin, sbcin, liftedIdx, lapse75, stormMotion, shearSfc500]
      enviro:     [pwat, frzLvl, rh2m, vis, snod, ptype, precip6h]
      upper-wind: [wind925, wind850, wind700, wind500, wind300, wind250, wind200]
      upper-dyn:  [rh925, rh850, rh700, rh500, vort500, vv700]
    # Global; we still render CONUS for app-side overlay parity. App can request
    # a global bbox later by adding a "GFS_GLOBAL" model entry.
    bbox_lonlat: [-134.0, 21.0, -60.0, 53.0]
    image_size: [1024, 1024]
    # Same grid as HRRR so the app-side decimation logic is model-agnostic.
    # GFS is 0.25° native, so 128 samples across 74° stays honest (no
    # sub-native oversampling worth worrying about).
    point_grid: [128, 128]
    forecast_hours_default: { start: 0, end: 120, step: 3 }
    s3_bucket: "noaa-gfs-bdp-pds"
    s3_key_template: "gfs.{date}/{run:02d}/atmos/gfs.t{run:02d}z.pgrb2.0p25.f{fh:03d}"
    runs_per_day: 4
    runs: [0, 6, 12, 18]
    retain_runs: 5
