# Canonical product catalog for storm-spotter-models-renderer.
#
# Each product has:
#   wgrib2_match:   regex passed to `wgrib2 -match` to select the GRIB message(s)
#   units_in:       native GRIB units (for documentation / sanity)
#   units_out:      display units after gdal/wgrib2 conversion
#   convert:        optional gdal_calc expression to convert raw -> display units
#                   placeholders: A = raw value
#                   (left blank = identity; gdaldem ramps work on raw values then)
#   clr:            color table file under config/color_tables/
#   pal:            matching .pal asset name (for the Flutter app)
#   display:        human-readable name shown in the model picker
#   point_values:   when true, publish a per-frame F###.json value grid next to
#                   the PNG (sample_point_values.py) for on-map numbers
#   point_decimals: decimals to keep in the published values (default 0)
#   point_value_fh_cap: publish that F###.json for fh <= N only, while the PNG
#                   still renders the full forecast range. build_manifest.py
#                   then reports pointValues false in productCatalog (the
#                   models tab would scrub off the end of the grids) and true
#                   in mesoCatalog. Independent of fh_cap, which caps the PNG
#                   too. NO CURRENT PRODUCT USES IT — srh/ehi did for a few
#                   hours on 2026-07-27 until the crosshair inspector needed
#                   grids at every scrubbed hour; kept for the next product
#                   whose grid is only ever read at one hour.
#   gpu_data:       {min, max} — when present, ALSO bake a value-encoded data
#                   PNG next to the colored one (F###.data.png): gray 1..255 =
#                   min..max linear in DISPLAY units, 0/alpha-0 = nodata. The
#                   app's GPU model layer samples it and colorizes in a shader
#                   (crisp at any zoom, like the MRMS data_png path). The
#                   colored PNG stays the back-compat/fallback frame; released
#                   apps ignore gpuDataMin/Max and keep rendering it.
#
# Models declare which products they publish in the `models:` map at the bottom.
#
# ECMWF (index_format: ecmwf) matches against the open-data JSON index
# instead of a wgrib2 idx: `ecmwf_match` is a regex over the canonical
# "param:levtype:levelist" key built per index line (levelist empty for
# sfc), e.g. "^2t:sfc:" or "^(u|v):pl:500$". Matched messages are fetched
# in param-alphabetical order, which keeps U before V for composite_uv.

products:
  refc:
    display: "Composite Reflectivity"
    group: "Surface & Precipitation/Radar"
    # No trailing colon: HRRR/GFS idx lines say ":REFC:entire atmosphere:"
    # but RRFS writes ":REFC:entire atmosphere (considered as a single
    # layer):" — the prefix matches all three, still a single message each.
    wgrib2_match: ":REFC:entire atmosphere"
    units_in: "dBZ"
    units_out: "dBZ"
    convert: ""
    clr: "refc.clr"
    pal: "hrrr_refc.pal"
    gpu_data: { min: -30.0, max: 80.0 }
    # Smooth, interpolated color gradient (no -nearest_color_entry) so
    # reflectivity renders like RadarOmega instead of hard 5-dBZ bands.
    # All other products omit this flag and keep crisp binned colors.
    interpolate_color: true

  t2m:
    display: "2m Temperature"
    group: "Surface & Precipitation/Surface"
    wgrib2_match: ":TMP:2 m above ground:"
    # GRIB encodes Kelvin per WMO convention, but GDAL's GRIB driver
    # auto-normalizes temperature to Celsius on read (per the GRIB
    # CF-conformance defaults). Convert Celsius -> Fahrenheit so the
    # .clr ramp (keyed in degF) lines up with the actual data.
    units_in: "C"
    units_out: "degF"
    convert: "A * 1.8 + 32"
    clr: "t2m.clr"
    pal: "hrrr_t2m.pal"
    gpu_data: { min: -60.0, max: 130.0 }
    ecmwf_match: "^2t:sfc:"
    point_values: true
    # also_meso: publish in the manifest's mesoCatalog too — the app's
    # Mesoanalysis layer lists this product (its f00 frame already
    # renders for the models tab, so reuse costs nothing).
    also_meso: true

  td2m:
    display: "2m Dewpoint"
    group: "Surface & Precipitation/Surface"
    wgrib2_match: ":DPT:2 m above ground:"
    # GDAL auto-normalizes K -> C, same as t2m. See note there.
    units_in: "C"
    units_out: "degF"
    convert: "A * 1.8 + 32"
    clr: "td2m.clr"
    pal: "hrrr_td2m.pal"
    gpu_data: { min: -60.0, max: 90.0 }
    ecmwf_match: "^2d:sfc:"
    point_values: true
    also_meso: true

  wind10m:
    display: "10m Wind Speed"
    group: "Surface & Precipitation/Surface"
    # Special: this product needs UGRD + VGRD combined into magnitude.
    # Handled with two-pass wgrib2 + gdal_calc; see decode_pipeline.sh.
    wgrib2_match: ":(UGRD|VGRD):10 m above ground:"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "hrrr_wind10m.pal"
    gpu_data: { min: 0.0, max: 120.0 }
    # Colon anchors the param so "100u:sfc:" can never match.
    ecmwf_match: "^(10u|10v):sfc:"
    point_values: true
    also_meso: true

  gust10m:
    display: "10m Wind Gust"
    group: "Surface & Precipitation/Surface"
    wgrib2_match: ":GUST:surface:"
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "hrrr_gust10m.pal"
    gpu_data: { min: 0.0, max: 140.0 }
    # ECMWF 10fg = max gust since the previous 3 h step (not instantaneous).
    ecmwf_match: "^10fg:sfc:"
    point_values: true
    also_meso: true

  mslp:
    display: "Mean Sea-Level Pressure"
    group: "Surface & Precipitation/Surface"
    # HRRR uses MSLMA, GFS uses PRMSL. NAM carries BOTH PRMSL and MSLET —
    # two messages are fetched and gdal_translate -b 1 takes the first in
    # message order, so NAM renders PRMSL (the standard reduction).
    wgrib2_match: ":(MSLMA|MSLET|PRMSL):mean sea level:"
    ecmwf_match: "^msl:sfc:"
    units_in: "Pa"
    units_out: "hPa"
    convert: "A / 100.0"
    clr: "mslp.clr"
    pal: "hrrr_mslp.pal"
    gpu_data: { min: 940.0, max: 1050.0 }
    point_values: true

  sfccape:
    display: "Surface CAPE"
    group: "Severe Weather/Instability"
    wgrib2_match: ":CAPE:surface:"
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cape.clr"
    pal: "hrrr_sfccape.pal"
    gpu_data: { min: 0.0, max: 6000.0 }
    point_values: true
    also_meso: true

  precip1h:
    display: "1-hour Precipitation"
    group: "Surface & Precipitation/Precipitation"
    # 1-hour bucket ending at the current fh: "(fh-1)-fh hour acc".
    # decode_pipeline.sh substitutes {fh} and {fh_minus_1} before matching.
    wgrib2_match: ":APCP:surface:{fh_minus_1}-{fh} hour acc"
    units_in: "kg/m^2"
    units_out: "in"
    convert: "A / 25.4"
    clr: "precip.clr"
    pal: "hrrr_precip1h.pal"
    gpu_data: { min: 0.0, max: 6.0 }
    point_values: true
    point_decimals: 2

  capeMU:
    display: "CAPE (Most Unstable)"
    group: "Severe Weather/Instability"
    # ECMWF open data publishes MUCAPE (not surface-based) — a separate
    # product code from sfccape so the display name stays honest, and from
    # the meso `mucape` (which is HRRR-analysis-only with fh_cap 1).
    ecmwf_match: "^mucape:sfc:"
    wgrib2_match: ""
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cape.clr"
    pal: "hrrr_sfccape.pal"
    gpu_data: { min: 0.0, max: 6000.0 }
    point_values: true

  precipTotalM:
    display: "Total Precipitation"
    group: "Surface & Precipitation/Precipitation"
    # ECMWF tp is a running total in METERS (vs kg/m^2 ≈ mm everywhere
    # else) — own product code so the m → in conversion can't collide
    # with precipTotal's mm → in.
    ecmwf_match: "^tp:sfc:"
    wgrib2_match: ""
    units_in: "m"
    units_out: "in"
    convert: "A * 39.3701"
    clr: "precip.clr"
    pal: "gfs_precipTotal.pal"
    gpu_data: { min: 0.0, max: 20.0 }
    point_values: true
    point_decimals: 2

  precip3h:
    display: "3-hour Precipitation"
    group: "Surface & Precipitation/Precipitation"
    # NAM's APCP buckets reset every 3 hours (f01 "0-1", f02 "0-2",
    # f03 "0-3", f04 "3-4", ...) — a constant-width bucket only completes
    # at 3-hour multiples, so fh_step renders every 3rd frame and the
    # manifest's expected list matches (see build_manifest.py). There is
    # no running-total APCP in the NAM nest files, hence no precipTotal.
    wgrib2_match: ":APCP:surface:{fh_minus_3}-{fh} hour acc"
    fh_min: 3
    fh_step: 3
    units_in: "kg/m^2"
    units_out: "in"
    convert: "A / 25.4"
    clr: "precip.clr"
    pal: "hrrr_precip1h.pal"
    gpu_data: { min: 0.0, max: 8.0 }
    point_values: true
    point_decimals: 2

  precip6h:
    display: "6-hour Precipitation"
    group: "Surface & Precipitation/Precipitation"
    # GFS APCP buckets reset every 6 h — the constant-width 6-h bucket
    # only exists at 6-hour-multiple steps ("6-12" at f012), so fh_step 6.
    # Same pattern as NAM's precip3h; {fh_minus_6} substitution lives in
    # decode_pipeline.sh alongside _1 and _3.
    wgrib2_match: ":APCP:surface:{fh_minus_6}-{fh} hour acc"
    fh_min: 6
    fh_step: 6
    units_in: "kg/m^2"
    units_out: "in"
    convert: "A / 25.4"
    clr: "precip.clr"
    pal: "hrrr_precip1h.pal"
    gpu_data: { min: 0.0, max: 8.0 }
    point_values: true
    point_decimals: 2

  # ── Pressure-level wind family ─────────────────────────────────────────
  # One entry per level (925 low-level jet .. 200 jet stream). All share
  # wind.clr + the gfs_wind500 legend; ECMWF matches included — its open
  # data publishes u/v at every one of these levels (verified 2026-08-06).

  wind925:
    display: "925mb Wind Speed"
    group: "Upper Air/Wind"
    wgrib2_match: ":(UGRD|VGRD):925 mb:"
    ecmwf_match: "^(u|v):pl:925$"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "gfs_wind500.pal"
    gpu_data: { min: 0.0, max: 200.0 }
    point_values: true

  wind850:
    display: "850mb Wind Speed"
    group: "Upper Air/Wind"
    wgrib2_match: ":(UGRD|VGRD):850 mb:"
    ecmwf_match: "^(u|v):pl:850$"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "gfs_wind500.pal"
    gpu_data: { min: 0.0, max: 200.0 }
    point_values: true

  wind700:
    display: "700mb Wind Speed"
    group: "Upper Air/Wind"
    wgrib2_match: ":(UGRD|VGRD):700 mb:"
    ecmwf_match: "^(u|v):pl:700$"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "gfs_wind500.pal"
    gpu_data: { min: 0.0, max: 200.0 }
    point_values: true

  wind300:
    display: "300mb Wind Speed"
    group: "Upper Air/Wind"
    wgrib2_match: ":(UGRD|VGRD):300 mb:"
    ecmwf_match: "^(u|v):pl:300$"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "gfs_wind500.pal"
    gpu_data: { min: 0.0, max: 200.0 }
    point_values: true

  wind250:
    display: "250mb Wind Speed"
    group: "Upper Air/Wind"
    wgrib2_match: ":(UGRD|VGRD):250 mb:"
    ecmwf_match: "^(u|v):pl:250$"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "gfs_wind500.pal"
    gpu_data: { min: 0.0, max: 200.0 }
    point_values: true

  wind200:
    display: "200mb Wind Speed"
    group: "Upper Air/Wind"
    wgrib2_match: ":(UGRD|VGRD):200 mb:"
    ecmwf_match: "^(u|v):pl:200$"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "gfs_wind500.pal"
    gpu_data: { min: 0.0, max: 200.0 }
    point_values: true

  # ── Upper-air moisture (pressure-level RH) ─────────────────────────────

  rh925:
    display: "925mb Relative Humidity"
    group: "Upper Air/Moisture"
    wgrib2_match: ":RH:925 mb:"
    ecmwf_match: "^r:pl:925$"
    units_in: "%"
    units_out: "%"
    convert: ""
    clr: "uarh.clr"
    pal: ""
    interpolate_color: true
    point_values: true

  rh850:
    display: "850mb Relative Humidity"
    group: "Upper Air/Moisture"
    wgrib2_match: ":RH:850 mb:"
    ecmwf_match: "^r:pl:850$"
    units_in: "%"
    units_out: "%"
    convert: ""
    clr: "uarh.clr"
    pal: ""
    interpolate_color: true
    point_values: true

  rh700:
    display: "700mb Relative Humidity"
    group: "Upper Air/Moisture"
    wgrib2_match: ":RH:700 mb:"
    ecmwf_match: "^r:pl:700$"
    units_in: "%"
    units_out: "%"
    convert: ""
    clr: "uarh.clr"
    pal: ""
    interpolate_color: true
    point_values: true

  rh500:
    display: "500mb Relative Humidity"
    group: "Upper Air/Moisture"
    wgrib2_match: ":RH:500 mb:"
    ecmwf_match: "^r:pl:500$"
    units_in: "%"
    units_out: "%"
    convert: ""
    clr: "uarh.clr"
    pal: ""
    interpolate_color: true
    point_values: true

  # ── Upper-air dynamics ─────────────────────────────────────────────────

  vort500:
    display: "500mb Absolute Vorticity"
    group: "Upper Air/Dynamics"
    wgrib2_match: ":ABSV:500 mb:"
    # Raw s^-1 -> display 10^-5 s^-1 (the classic chart unit).
    units_in: "1/s"
    units_out: "10⁻⁵/s"
    convert: "A * 100000.0"
    clr: "vort.clr"
    pal: ""
    interpolate_color: true
    point_values: true

  vv700:
    display: "700mb Vertical Velocity"
    group: "Upper Air/Dynamics"
    wgrib2_match: ":VVEL:700 mb:"
    # Omega in Pa/s; NEGATIVE = lift. vv.clr paints lift warm.
    units_in: "Pa/s"
    units_out: "Pa/s"
    convert: ""
    clr: "vv.clr"
    pal: ""
    interpolate_color: true
    point_values: true
    point_decimals: 1

  shearSfc500:
    display: "Bulk Shear (Sfc-500mb)"
    group: "Severe Weather/Wind Shear"
    derived: true
    # |V(500mb) - V(10m)| in kt — Pivotal's "Bulk Shear: Surface-500 mb".
    # GFS carries no VUCSH fields, so this stands in for deep-layer shear.
    inputs:
      A: ":UGRD:10 m above ground:"
      B: ":VGRD:10 m above ground:"
      C: ":UGRD:500 mb:"
      D: ":VGRD:500 mb:"
    calc: "sqrt((C-A)*(C-A)+(D-B)*(D-B))*1.94384"
    units_in: ""
    units_out: "kt"
    convert: ""
    clr: "shear.clr"
    pal: ""
    point_values: true

  wind500:
    display: "500mb Wind Speed"
    group: "Upper Air/Wind"
    wgrib2_match: ":(UGRD|VGRD):500 mb:"
    ecmwf_match: "^(u|v):pl:500$"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "gfs_wind500.pal"
    gpu_data: { min: 0.0, max: 200.0 }
    point_values: true

  precipTotal:
    display: "Total Precipitation"
    group: "Surface & Precipitation/Precipitation"
    # fh_min: the f00 running total is zero by definition — GFS doesn't
    # even publish an f000 APCP message (its f00 slot painted "missing"
    # red on the scrub bar since launch; this fixes that), and RRFS
    # lacks it too. Added 2026-08-05 with the NAM/RRFS expansion.
    fh_min: 1
    wgrib2_match: ":APCP:surface:0-"
    units_in: "kg/m^2"
    units_out: "in"
    convert: "A / 25.4"
    clr: "precip.clr"
    pal: "gfs_precipTotal.pal"
    gpu_data: { min: 0.0, max: 20.0 }
    point_values: true
    point_decimals: 2

  # ── Cloud cover family (added 2026-08-05, Pivotal parity) ──────────────
  # HRRR wrfsfc carries all four at every hour incl. f00 (verified against
  # the 2026-08-05 18z idx). ⚠ TCDC appears TWICE in the file — "entire
  # atmosphere" AND "boundary layer cloud layer" — so the match anchors the
  # level text. No-trailing-colon prefix like refc, so an RRFS-style
  # "(considered as a single layer)" suffix still matches if these are ever
  # mirrored there. interpolate_color: coverage is a continuous veil, not a
  # threshold-read parameter — hard bins would just look like banding.

  tcc:
    display: "Cloud Cover"
    group: "Clouds & Satellite"
    wgrib2_match: ":TCDC:entire atmosphere"
    units_in: "%"
    units_out: "%"
    convert: ""
    clr: "cloud.clr"
    pal: ""
    interpolate_color: true
    point_values: true

  lcc:
    display: "Cloud Cover (Low)"
    group: "Clouds & Satellite"
    wgrib2_match: ":LCDC:low cloud layer:"
    units_in: "%"
    units_out: "%"
    convert: ""
    clr: "cloudlow.clr"
    pal: ""
    interpolate_color: true
    point_values: true

  mcc:
    display: "Cloud Cover (Mid)"
    group: "Clouds & Satellite"
    wgrib2_match: ":MCDC:middle cloud layer:"
    units_in: "%"
    units_out: "%"
    convert: ""
    clr: "cloudmid.clr"
    pal: ""
    interpolate_color: true
    point_values: true

  hcc:
    display: "Cloud Cover (High)"
    group: "Clouds & Satellite"
    wgrib2_match: ":HCDC:high cloud layer:"
    units_in: "%"
    units_out: "%"
    convert: ""
    clr: "cloudhigh.clr"
    pal: ""
    interpolate_color: true
    point_values: true

  # ── Pivotal-parity batch 2 (added 2026-08-05) ───────────────────────────
  # Ten more single-message wrfsfc fields, all verified in the 2026-08-05
  # 18z idx at f00 AND f09. Accumulation/max fields carry "0-0 day acc/max"
  # text at f00 vs "0-N hour" later, so their matches anchor on the level
  # text (or the "0-" accumulation prefix) and deliberately stop there.

  refd1km:
    display: "1km AGL Reflectivity"
    group: "Surface & Precipitation/Radar"
    # File also carries REFD at 4000 m and 263 K — anchor the level.
    wgrib2_match: ":REFD:1000 m above ground:"
    units_in: "dBZ"
    units_out: "dBZ"
    convert: ""
    clr: "refc.clr"
    pal: "hrrr_refc.pal"
    # Same smooth gradient + palette as composite reflectivity.
    interpolate_color: true

  irsat:
    display: "Simulated IR Satellite"
    group: "Clouds & Satellite"
    # SBT124 = simulated GOES-East longwave-IR-window brightness temp.
    # (SBT123 in the same file is the water-vapor channel — a possible
    # future product, don't loosen this match.)
    wgrib2_match: ":SBT124:top of atmosphere:"
    # ⚠ Unlike t2m, GDAL does NOT K->C normalize SBT brightness temps —
    # verified 2026-08-05 when the Celsius-keyed first attempt rendered
    # single-color. irsat.clr is keyed in raw KELVIN.
    units_in: "K"
    units_out: "K"
    convert: ""
    clr: "irsat.clr"
    pal: ""
    interpolate_color: true

  smokesfc:
    display: "Near-Surface Smoke"
    group: "Fire Weather"
    wgrib2_match: ":MASSDEN:8 m above ground:"
    # Raw kg/m^3 -> ug/m^3. ⚠ verify against the first render's logged
    # raw.tif stats (expected raw magnitudes ~1e-9..1e-7).
    units_in: "kg/m^3"
    units_out: "µg/m³"
    convert: "A * 1000000000.0"
    clr: "smoke.clr"
    pal: ""
    interpolate_color: true
    point_values: true

  smokeint:
    display: "Integrated Smoke"
    group: "Fire Weather"
    wgrib2_match: ":COLMD:entire atmosphere"
    # Raw kg/m^2 -> mg/m^2. Same first-render stats check as smokesfc.
    units_in: "kg/m^2"
    units_out: "mg/m²"
    convert: "A * 1000000.0"
    clr: "smokeint.clr"
    pal: ""
    interpolate_color: true
    point_values: true

  ltng:
    display: "Lightning Threat"
    group: "Severe Weather/Composites"
    # fh_min: HRRR carries an f00 'anl' message but NAM/RRFS only publish
    # LTNG on forecast hours (RRFS as an hourly max) — and the f00 threat
    # is zero anyway, so skipping f00 everywhere keeps the shared entry
    # consistent across models.
    fh_min: 1
    # Level text differs by model: HRRR/RRFS say "entire atmosphere",
    # NAM writes ":LTNG:surface:" (found 2026-08-05 when NAM rendered 0
    # ltng frames while its whole hazards group succeeded).
    wgrib2_match: ":LTNG:(entire atmosphere|surface):"
    units_in: "flashes/km^2"
    units_out: "fl/km²"
    convert: ""
    clr: "ltng.clr"
    pal: ""
    point_values: true
    point_decimals: 1

  sbcin:
    display: "Surface CIN"
    group: "Severe Weather/Instability"
    # File carries CIN at surface, 180-0, 90-0 (mlcin) and 255-0 mb —
    # ":CIN:surface:" is unique.
    wgrib2_match: ":CIN:surface:"
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cin.clr"
    pal: ""
    point_values: true

  uh25:
    display: "Updraft Helicity (1h max)"
    group: "Severe Weather/Wind Shear"
    # Hourly-max 2-5 km UH. File also has 2000-0 and 3000-0 m layers.
    # fh_min: NAM/RRFS have no f00 MXUPHL message (HRRR's is a zeros
    # '0-0 day max') — skip f00 on every model for consistency.
    fh_min: 1
    wgrib2_match: ":MXUPHL:5000-2000 m above ground:"
    units_in: "m^2/s^2"
    units_out: "m²/s²"
    convert: ""
    clr: "uh.clr"
    pal: ""
    point_values: true

  snod:
    display: "Snow Depth"
    group: "Winter Weather"
    wgrib2_match: ":SNOD:surface:"
    units_in: "m"
    units_out: "in"
    convert: "A * 39.3701"
    clr: "snow.clr"
    pal: ""
    point_values: true
    point_decimals: 1

  asnow:
    display: "Total Snowfall"
    group: "Winter Weather"
    # HRRR's native ASNOW accumulation (what Pivotal labels Total
    # Snowfall) — NOT a Kuchera-ratio product; that needs the wrfprs
    # column temps and stays out of scope.
    # fh_min: no f00 message on RRFS (HRRR's is a zeros '0-0 day acc').
    fh_min: 1
    wgrib2_match: ":ASNOW:surface:0-"
    units_in: "m"
    units_out: "in"
    convert: "A * 39.3701"
    clr: "snow.clr"
    pal: ""
    point_values: true
    point_decimals: 1

  frzr:
    display: "Total Freezing Rain"
    group: "Winter Weather"
    # fh_min: no f00 running-total message on RRFS; HRRR's is zeros.
    fh_min: 1
    wgrib2_match: ":FRZR:surface:0-"
    units_in: "kg/m^2"
    units_out: "in"
    convert: "A / 25.4"
    clr: "ice.clr"
    pal: ""
    point_values: true
    point_decimals: 2

  # ── Mesoanalysis products ────────────────────────────────────────────────
  # Severe-weather parameters for the app's Mesoanalysis map layer
  # (SPC-mesoanalysis-style shaded fields under radar).
  #
  # HISTORY: this whole section began as analysis-only (fh_cap: 1 +
  # category: meso — f00/f01 frames, mesoCatalog-only so the models tab
  # never listed them). srh1/srh3/ehi1/ehi3 were promoted to full-forecast
  # `also_meso` products on 2026-07-27, and the REST of the section followed
  # on 2026-08-05 (Pivotal-parity request) once the render workflow fanned
  # out into parallel product-group jobs and could afford the frames. Every
  # product here is now dual-role: scrubbable in the models tab AND listed
  # in the meso picker (whose layer just consumes the f00 frame these
  # renders already produce).
  #
  # For any FUTURE analysis-only product, the old mechanics still work:
  #   fh_cap: 1       render only f00 + f01 (bridge frame while the next
  #                   run's f00 is still publishing)
  #   category: meso  publish in mesoCatalog ONLY, so app versions that
  #                   predate the meso layer never see a 2-frame product
  #                   in the forecast-scrub models picker
  #
  # Derived products (stp, scp) set `derived: true` with named `inputs`
  # (letter -> idx match regex, one message each) and a gdal_calc `calc`
  # expression over those letters. Formulas are kept EXACTLY in sync with
  # the app's sounding_analysis.dart (_stpFixed / _scp) so a tapped map
  # value never disagrees with the sounding sheet at the same point:
  #   * STP includes Thompson's CIN term (the app's deliberate choice) —
  #     values run lower than SPC's fixed-layer STP wherever SBCIN < -50.
  #   * SCP uses SRH3/BWD6 (the app's fallback when effective-layer values
  #     are unavailable).

  mlcape:
    display: "MLCAPE"
    group: "Severe Weather/Instability"
    wgrib2_match: ":CAPE:90-0 mb above ground:"
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cape.clr"
    pal: ""
    point_values: true
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  mucape:
    display: "MUCAPE"
    group: "Severe Weather/Instability"
    wgrib2_match: ":CAPE:255-0 mb above ground:"
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cape.clr"
    pal: ""
    point_values: true
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  mlcin:
    display: "MLCIN"
    group: "Severe Weather/Instability"
    wgrib2_match: ":CIN:90-0 mb above ground:"
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cin.clr"
    pal: ""
    point_values: true
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  # Full-range 512² point grids (no point_value_fh_cap) on this whole
  # section: the crosshair / long-press inspector samples these at whatever
  # hour the models tab has scrubbed to, so every frame needs its JSON.
  # srh/ehi briefly shipped capped at f00/f01 (2026-07-27, same day) before
  # the inspector work made that a dead end. ~930 KB/frame raw but
  # ~50-200 KB over the wire (CDN gzip) — pennies on B2, uploads free.

  srh1:
    display: "0-1km SRH"
    group: "Severe Weather/Wind Shear"
    wgrib2_match: ":HLCY:1000-0 m above ground:"
    units_in: "m^2/s^2"
    units_out: "m²/s²"
    convert: ""
    clr: "srh.clr"
    pal: ""
    point_values: true
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  srh3:
    display: "0-3km SRH"
    group: "Severe Weather/Wind Shear"
    wgrib2_match: ":HLCY:3000-0 m above ground:"
    units_in: "m^2/s^2"
    units_out: "m²/s²"
    convert: ""
    clr: "srh.clr"
    pal: ""
    point_values: true
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  shear6:
    display: "0-6km Shear"
    group: "Severe Weather/Wind Shear"
    # ⚠ HRRR labels VUCSH/VVCSH as [1/s] but the encoded values are the
    # bulk wind-difference vector components in m/s (verified empirically
    # 2026-07-08: magnitudes 0-35 with p99 ≈ 23 — true shear-per-second
    # would be ~0.005). Treat exactly like a U/V wind pair.
    wgrib2_match: ":(VUCSH|VVCSH):0-6000 m above ground:"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "shear.clr"
    pal: ""
    point_values: true
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  stp:
    display: "Sig. Tornado (STP)"
    group: "Severe Weather/Composites"
    derived: true
    # Mirrors sounding_analysis.dart _stpFixed (STP-cin variant):
    #   capeTerm  = SBCAPE/1500
    #   lclTerm   = clip((2000 - LCL_agl)/1000, 0, 1)   LCL_agl = LCL_msl - terrain
    #   srhTerm   = SRH1/150
    #   shearTerm = 0 below 12.5 m/s, else min(shr6,30)/20  (cap 1.5)
    #   cinTerm   = clip((200 + SBCIN)/150, 0, 1)        (SBCIN is negative)
    inputs:
      A: ":CAPE:surface:"
      B: ":CIN:surface:"
      C: ":HGT:level of adiabatic condensation from sfc:"
      D: ":HGT:surface:"
      E: ":HLCY:1000-0 m above ground:"
      F: ":VUCSH:0-6000 m above ground:"
      G: ":VVCSH:0-6000 m above ground:"
    calc: "maximum((A/1500.0)*clip((2000.0-(C-D))/1000.0,0,1)*(E/150.0)*where(sqrt(F*F+G*G)<12.5,0,minimum(sqrt(F*F+G*G),30.0)/20.0)*clip((200.0+B)/150.0,0,1),0)"
    units_in: ""
    units_out: ""
    convert: ""
    clr: "stp.clr"
    pal: ""
    point_values: true
    point_decimals: 1
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  scp:
    display: "Supercell Comp. (SCP)"
    group: "Severe Weather/Composites"
    derived: true
    # Mirrors sounding_analysis.dart _scp with the SRH3/BWD6 fallback:
    #   (MUCAPE/1000) * (SRH3/50) * shearTerm
    #   shearTerm = 0 below 10 m/s, else min(shr6,20)/20  (cap 1.0)
    inputs:
      A: ":CAPE:255-0 mb above ground:"
      B: ":HLCY:3000-0 m above ground:"
      C: ":VUCSH:0-6000 m above ground:"
      D: ":VVCSH:0-6000 m above ground:"
    calc: "maximum((A/1000.0)*(B/50.0)*where(sqrt(C*C+D*D)<10.0,0,minimum(sqrt(C*C+D*D),20.0)/20.0),0)"
    units_in: ""
    units_out: ""
    convert: ""
    clr: "scp.clr"
    pal: ""
    point_values: true
    point_decimals: 1
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  # ── Mesoanalysis catalog v2 (SPC-style groups) ──────────────────────────
  # Same rules as the first meso set: fh_cap 1, category meso, formulas
  # kept dumb enough to audit against the SPC page. Grouping lives in the
  # app's kMesoParameters (Thermodynamics / Wind Shear / Composite Indices /
  # Surface / Heavy Rain / Winter Weather / Fire Weather).

  cape3km:
    display: "0-3km CAPE"
    group: "Severe Weather/Instability"
    wgrib2_match: ":CAPE:0-3000 m above ground:"
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cape3km.clr"
    pal: ""
    point_values: true
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  liftedIdx:
    display: "Lifted Index"
    group: "Severe Weather/Instability"
    # ⚠ LFTX is a temperature-typed field (K): if GDAL's CF normalization
    # subtracts 273.15 the raw stats will sit near -280 — check the logged
    # raw.tif stats on first render and add `convert: "A + 273.15"` if so.
    wgrib2_match: ":LFTX:500-1000 mb:"
    units_in: "K"
    units_out: "°C"
    convert: ""
    clr: "lifted.clr"
    pal: ""
    point_values: true
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  lapse75:
    display: "700-500mb Lapse Rate"
    group: "Severe Weather/Instability"
    derived: true
    # (T700 - T500) / (z500 - z700) in °C/km. Temperature DIFFERENCE, so
    # any K→C normalization by the GRIB driver cancels out. max() guards
    # a degenerate thickness (never happens on real data).
    inputs:
      A: ":TMP:700 mb:"
      B: ":TMP:500 mb:"
      C: ":HGT:500 mb:"
      D: ":HGT:700 mb:"
    calc: "(A-B)/maximum((C-D)/1000.0,0.1)"
    units_in: ""
    units_out: "°C/km"
    convert: ""
    clr: "lapse.clr"
    pal: ""
    point_values: true
    point_decimals: 1
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  lclHgt:
    display: "LCL Height"
    group: "Severe Weather/Instability"
    derived: true
    # LCL above ground = LCL MSL height minus terrain height.
    inputs:
      A: ":HGT:level of adiabatic condensation from sfc:"
      B: ":HGT:surface:"
    calc: "maximum(A-B,0)"
    units_in: "m"
    units_out: "m"
    convert: ""
    clr: "lcl.clr"
    pal: ""
    point_values: true
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  shear1:
    display: "0-1km Shear"
    group: "Severe Weather/Wind Shear"
    # Same [1/s]-labeled-but-actually-m/s gotcha as shear6.
    wgrib2_match: ":(VUCSH|VVCSH):0-1000 m above ground:"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "shear1.clr"
    pal: ""
    point_values: true
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  stormMotion:
    display: "Storm Motion"
    group: "Severe Weather/Wind Shear"
    # Bunkers right-mover storm motion vector -> speed. (Direction can't
    # render as a raster; the sounding hodograph covers it.)
    # Level text differs by model: HRRR writes "0-6000 m", NAM/RRFS write
    # "6000-0 m" for the SAME layer — the alternation covers both.
    wgrib2_match: ":(USTM|VSTM):(0-6000|6000-0) m above ground:"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: ""
    point_values: true
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  # ehi1/ehi3: dual-role like srh1/srh3 — see the note above those entries.
  # Both mirror sounding_analysis.dart _ehi exactly, (CAPE * SRH) / 160000
  # floored at 0, with the SAME surface-based CAPE the sounding sheet feeds
  # it (_ehi(sb.capeJkg, srh1) / _ehi(sb.capeJkg, srh3)). SPC's mesoanalysis
  # page uses MLCAPE for EHI, so these run a bit hotter than SPC's under a
  # capped/heated boundary layer — that's the deliberate app-agreement rule
  # already applied to STP/SCP. Do NOT "fix" one side alone.
  ehi1:
    display: "EHI (0-1km)"
    group: "Severe Weather/Composites"
    derived: true
    inputs:
      A: ":CAPE:surface:"
      B: ":HLCY:1000-0 m above ground:"
    calc: "maximum((A*B)/160000.0,0)"
    units_in: ""
    units_out: ""
    convert: ""
    clr: "ehi.clr"
    pal: ""
    point_values: true
    point_decimals: 1
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  ehi3:
    display: "EHI (0-3km)"
    group: "Severe Weather/Composites"
    derived: true
    inputs:
      A: ":CAPE:surface:"
      B: ":HLCY:3000-0 m above ground:"
    calc: "maximum((A*B)/160000.0,0)"
    units_in: ""
    units_out: ""
    convert: ""
    # Shares ehi.clr with ehi1. 0-3 km EHI runs ~2-3x the 0-1 km value for
    # the same profile (SRH3 >> SRH1), so the ramp's upper bins do the work
    # here — matching the app, whose ehi3 legend reuses the ehi1 stops.
    clr: "ehi.clr"
    pal: ""
    point_values: true
    point_decimals: 1
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  pwat:
    display: "Precipitable Water"
    group: "Surface & Precipitation/Precipitation"
    wgrib2_match: ":PWAT:entire atmosphere"
    units_in: "kg/m^2"
    units_out: "in"
    convert: "A / 25.4"
    clr: "pwat.clr"
    pal: ""
    point_values: true
    point_decimals: 2
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  echoTops:
    display: "Echo Tops"
    group: "Severe Weather/Composites"
    wgrib2_match: ":RETOP:cloud top:"
    units_in: "m"
    units_out: "kft"
    convert: "A * 0.00328084"
    clr: "etops.clr"
    pal: ""
    point_values: true
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  ptype:
    display: "Precip Type"
    group: "Surface & Precipitation/Precipitation"
    derived: true
    # Categorical composite of HRRR's dominant-type 0/1 flags:
    # 1 rain, 2 snow, 3 sleet, 4 freezing rain. Rendered with the
    # default nearest-color mapping (discrete bins); no point values —
    # the numbers would be category codes, not measurements.
    #
    # fh_min: the categorical flags are ALL-ZERO at f00 (verified
    # 2026-07-08: f00 CRAIN nonzero=0, f01 nonzero=109k) — HRRR only
    # populates them on forecast hours. Render starts at f01; the app's
    # meso layer follows each product's first expected hour.
    fh_min: 1
    inputs:
      A: ":CRAIN:surface:"
      B: ":CSNOW:surface:"
      C: ":CICEP:surface:"
      D: ":CFRZR:surface:"
    calc: "A*1+B*2+C*3+D*4"
    units_in: ""
    units_out: ""
    convert: ""
    clr: "ptype.clr"
    pal: ""
    point_values: false
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  frzLvl:
    display: "Freezing Level"
    group: "Winter Weather"
    wgrib2_match: ":HGT:0C isotherm:"
    units_in: "m"
    units_out: "m"
    convert: ""
    clr: "frzlvl.clr"
    pal: ""
    point_values: true
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  rh2m:
    display: "2m Relative Humidity"
    group: "Surface & Precipitation/Surface"
    wgrib2_match: ":RH:2 m above ground:"
    units_in: "%"
    units_out: "%"
    convert: ""
    clr: "rh.clr"
    pal: ""
    point_values: true
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  vis:
    display: "Surface Visibility"
    group: "Surface & Precipitation/Surface"
    wgrib2_match: ":VIS:surface:"
    units_in: "m"
    units_out: "mi"
    convert: "A / 1609.34"
    clr: "vis.clr"
    pal: ""
    point_values: true
    point_decimals: 1
    also_meso: true
    # Denser value grid than the model default (128): the cell-picker
    # readout interpolates this, and 512 =~ 12 km/sample over CONUS.
    point_grid: [512, 512]

  # ── RTMA surface observations (render_rtma_obs.sh) ─────────────────────
  # 2.5 km analysis-of-observations grids for the app's Observations layer
  # "Surface" section. The RTMA model block (bottom of this file) reuses the
  # shared t2m/td2m/wind10m/gust10m entries above — render_rtma_obs.sh does
  # its own field selection/conversion, reading only clr + gpu_data from
  # here, so wgrib2_match/ecmwf_match on the shared entries are ignored.
  # thetae is the one RTMA-only product.

  thetae:
    display: "2m Theta-E"
    # Derived in render_rtma_obs.sh (Bolton 1980) from TMP 2m + DPT 2m +
    # PRES surface — no wgrib2_match. Kelvin, SPC-mesoanalysis convention.
    units_in: "K"
    units_out: "K"
    convert: ""
    clr: "thetae.clr"
    pal: ""
    gpu_data: { min: 250.0, max: 400.0 }
    point_values: false
    group: "Surface"

  # ── Observed precipitation (MRMS QPE) ───────────────────────────────────
  # Radar+gauge observed accumulation for the app's "Observations (Precip)"
  # map layer. NOT rendered by decode_pipeline.sh — these have no runs or
  # forecast hours; scripts/render_mrms_qpe.sh fetches the MRMS grib2
  # directly from the noaa-mrms-pds AWS bucket and publishes each valid
  # hour as a single-frame pseudo-run (RunStamp = accumulation END hour,
  # frame F000) so build_manifest.py / prune_old_runs.py / the app's
  # frame-fetch plumbing all work unchanged.
  #
  #   mrms_product: source directory prefix on noaa-mrms-pds (the script
  #                 appends _Pass2_00.00 / _Pass1_00.00).
  # MRMS QPE encodes mm with sentinel negatives (-1 missing, -3 outside
  # radar coverage) — the render script maps A<0 → NoData before mm→in.

  qpe01h:
    display: "1-hour Precip"
    mrms_product: "MultiSensor_QPE_01H"
    units_in: "mm"
    units_out: "in"
    clr: "qpe.clr"
    # Additive value PNG (F000.data.png) for the app's crosshair inspector.
    # The colorized F000.png still renders the fill; this just gives the
    # readout the fill's own full-res values instead of the coarse 512²
    # point grid. max = qpe.clr ceiling (20 in) so it never clips below a
    # color the fill can show. See render_mrms_qpe.sh.
    gpu_data: { min: 0.0, max: 20.0 }
    pal: ""
    group: "Precipitation"
    point_values: true
    point_decimals: 2
    point_grid: [512, 512]

  qpe03h:
    display: "3-hour Precip"
    mrms_product: "MultiSensor_QPE_03H"
    units_in: "mm"
    units_out: "in"
    clr: "qpe.clr"
    gpu_data: { min: 0.0, max: 20.0 }
    pal: ""
    group: "Precipitation"
    point_values: true
    point_decimals: 2
    point_grid: [512, 512]

  qpe06h:
    display: "6-hour Precip"
    mrms_product: "MultiSensor_QPE_06H"
    units_in: "mm"
    units_out: "in"
    clr: "qpe.clr"
    gpu_data: { min: 0.0, max: 20.0 }
    pal: ""
    group: "Precipitation"
    point_values: true
    point_decimals: 2
    point_grid: [512, 512]

  qpe12h:
    display: "12-hour Precip"
    mrms_product: "MultiSensor_QPE_12H"
    units_in: "mm"
    units_out: "in"
    clr: "qpe.clr"
    gpu_data: { min: 0.0, max: 20.0 }
    pal: ""
    group: "Precipitation"
    point_values: true
    point_decimals: 2
    point_grid: [512, 512]

  qpe24h:
    display: "24-hour Precip"
    mrms_product: "MultiSensor_QPE_24H"
    units_in: "mm"
    units_out: "in"
    clr: "qpe.clr"
    gpu_data: { min: 0.0, max: 20.0 }
    pal: ""
    group: "Precipitation"
    point_values: true
    point_decimals: 2
    point_grid: [512, 512]

  # ── MRMS observation catalog (render_mrms_obs.sh) ──────────────────
  # Latest-frame products: sub-hourly publishes (2-min radar mosaics,
  # 10-min FLASH) with arbitrary -HHMMSS stamps and NO Pass1/Pass2 cycle,
  # so these use `mrms_dir` (the full CONUS/ prefix) instead of
  # `mrms_product`, and render_mrms_obs.sh lists the S3 day dir and takes
  # the newest object. `scale` multiplies values AFTER the A<0 sentinel
  # mask (-1 missing / -3 no-coverage → NoData); products left at 1 pass
  # native units through. `group` reaches the app via the manifest
  # catalog to build the categorized picker.

