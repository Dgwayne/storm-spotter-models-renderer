# Canonical product catalog for storm-spotter-models-renderer.
#
# Each product has:
#   wgrib2_match:   regex passed to `wgrib2 -match` to select the GRIB message(s)
#   units_in:       native GRIB units (for documentation / sanity)
#   units_out:      display units after gdal/wgrib2 conversion
#   convert:        optional gdal_calc expression to convert raw -> display units
#                   placeholders: A = raw value
#                   (left blank = identity; gdaldem ramps work on raw values then)
#   clr:            color table file under config/color_tables/
#   pal:            matching .pal asset name (for the Flutter app)
#   display:        human-readable name shown in the model picker
#   point_values:   when true, publish a per-frame F###.json value grid next to
#                   the PNG (sample_point_values.py) for on-map numbers
#   point_decimals: decimals to keep in the published values (default 0)
#
# Models declare which products they publish in the `models:` map at the bottom.

products:
  refc:
    display: "Composite Reflectivity"
    wgrib2_match: ":REFC:entire atmosphere:"
    units_in: "dBZ"
    units_out: "dBZ"
    convert: ""
    clr: "refc.clr"
    pal: "hrrr_refc.pal"
    # Smooth, interpolated color gradient (no -nearest_color_entry) so
    # reflectivity renders like RadarOmega instead of hard 5-dBZ bands.
    # All other products omit this flag and keep crisp binned colors.
    interpolate_color: true

  t2m:
    display: "2m Temperature"
    wgrib2_match: ":TMP:2 m above ground:"
    # GRIB encodes Kelvin per WMO convention, but GDAL's GRIB driver
    # auto-normalizes temperature to Celsius on read (per the GRIB
    # CF-conformance defaults). Convert Celsius -> Fahrenheit so the
    # .clr ramp (keyed in degF) lines up with the actual data.
    units_in: "C"
    units_out: "degF"
    convert: "A * 1.8 + 32"
    clr: "t2m.clr"
    pal: "hrrr_t2m.pal"
    point_values: true

  td2m:
    display: "2m Dewpoint"
    wgrib2_match: ":DPT:2 m above ground:"
    # GDAL auto-normalizes K -> C, same as t2m. See note there.
    units_in: "C"
    units_out: "degF"
    convert: "A * 1.8 + 32"
    clr: "td2m.clr"
    pal: "hrrr_td2m.pal"
    point_values: true

  wind10m:
    display: "10m Wind Speed"
    # Special: this product needs UGRD + VGRD combined into magnitude.
    # Handled with two-pass wgrib2 + gdal_calc; see decode_pipeline.sh.
    wgrib2_match: ":(UGRD|VGRD):10 m above ground:"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "hrrr_wind10m.pal"
    point_values: true

  gust10m:
    display: "10m Wind Gust"
    wgrib2_match: ":GUST:surface:"
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "hrrr_gust10m.pal"
    point_values: true

  mslp:
    display: "Mean Sea-Level Pressure"
    # HRRR uses MSLMA, NAM uses MSLET, GFS uses PRMSL.
    wgrib2_match: ":(MSLMA|MSLET|PRMSL):mean sea level:"
    units_in: "Pa"
    units_out: "hPa"
    convert: "A / 100.0"
    clr: "mslp.clr"
    pal: "hrrr_mslp.pal"
    point_values: true

  sfccape:
    display: "Surface CAPE"
    wgrib2_match: ":CAPE:surface:"
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cape.clr"
    pal: "hrrr_sfccape.pal"
    point_values: true

  precip1h:
    display: "1-hour Precipitation"
    # 1-hour bucket ending at the current fh: "(fh-1)-fh hour acc".
    # decode_pipeline.sh substitutes {fh} and {fh_minus_1} before matching.
    wgrib2_match: ":APCP:surface:{fh_minus_1}-{fh} hour acc"
    units_in: "kg/m^2"
    units_out: "in"
    convert: "A / 25.4"
    clr: "precip.clr"
    pal: "hrrr_precip1h.pal"
    point_values: true
    point_decimals: 2

  wind500:
    display: "500mb Wind Speed"
    wgrib2_match: ":(UGRD|VGRD):500 mb:"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "gfs_wind500.pal"
    point_values: true

  precipTotal:
    display: "Total Precipitation"
    wgrib2_match: ":APCP:surface:0-"
    units_in: "kg/m^2"
    units_out: "in"
    convert: "A / 25.4"
    clr: "precip.clr"
    pal: "gfs_precipTotal.pal"
    point_values: true
    point_decimals: 2

models:
  HRRR:
    products:
      - refc
      - t2m
      - td2m
      - wind10m
      - gust10m
      - mslp
      - sfccape
      - precip1h
    # CONUS bbox (Lambert -> reprojected to EPSG:3857 by gdalwarp at render time)
    bbox_lonlat: [-134.0, 21.0, -60.0, 53.0]
    # Smoothness over sharpness (decided after testing). Animation scrub
    # cost is dominated by per-frame texture size: 2048^2 ≈ 16 MB RGBA,
    # 3072^2 ≈ 36 MB, 4096^2 ≈ 64 MB. 4096 (native ~3 km) and even 3072
    # made scrubbing stutter on phones, so we're back at 2048 — the
    # original, which scrubbed smoothly. Tradeoff: ~6 km/px (a little soft)
    # vs the model's native 3 km. Keep the cubic resampling below (it
    # sharpens edges slightly at zero playback cost — purely a render-time
    # kernel). If sharpness ever matters more than smooth animation, bump
    # this back up (4096 = native ceiling; mobile-GPU texture cap ~4096).
    image_size: [2048, 2048]
    # Point-value sample grid (sample_point_values.py). 128x128 over the
    # CONUS bbox ≈ one number every ~0.6° lon; evenly spaced on-screen in
    # mercator. The app decimates by zoom with power-of-2 strides, so keep
    # this a power of two.
    point_grid: [128, 128]
    # f00..f18 always; f00..f48 on synoptic runs.
    forecast_hours_default: { start: 0, end: 18, step: 1 }
    forecast_hours_synoptic: { start: 0, end: 48, step: 1, runs: [0, 6, 12, 18] }
    # AWS public bucket (no auth needed)
    s3_bucket: "noaa-hrrr-bdp-pds"
    s3_key_template: "hrrr.{date}/conus/hrrr.t{run:02d}z.wrfsfcf{fh:02d}.grib2"
    runs_per_day: 24
    retain_runs: 5

  GFS:
    products:
      - refc
      - t2m
      - wind500
      - mslp
      - precipTotal
    # Global; we still render CONUS for app-side overlay parity. App can request
    # a global bbox later by adding a "GFS_GLOBAL" model entry.
    bbox_lonlat: [-134.0, 21.0, -60.0, 53.0]
    image_size: [1024, 1024]
    # Same grid as HRRR so the app-side decimation logic is model-agnostic.
    # GFS is 0.25° native, so 128 samples across 74° stays honest (no
    # sub-native oversampling worth worrying about).
    point_grid: [128, 128]
    forecast_hours_default: { start: 0, end: 120, step: 3 }
    s3_bucket: "noaa-gfs-bdp-pds"
    s3_key_template: "gfs.{date}/{run:02d}/atmos/gfs.t{run:02d}z.pgrb2.0p25.f{fh:03d}"
    runs_per_day: 4
    runs: [0, 6, 12, 18]
    retain_runs: 5
