# Canonical product catalog for storm-spotter-models-renderer.
#
# Each product has:
#   wgrib2_match:   regex passed to `wgrib2 -match` to select the GRIB message(s)
#   units_in:       native GRIB units (for documentation / sanity)
#   units_out:      display units after gdal/wgrib2 conversion
#   convert:        optional gdal_calc expression to convert raw -> display units
#                   placeholders: A = raw value
#                   (left blank = identity; gdaldem ramps work on raw values then)
#   clr:            color table file under config/color_tables/
#   pal:            matching .pal asset name (for the Flutter app)
#   display:        human-readable name shown in the model picker
#   point_values:   when true, publish a per-frame F###.json value grid next to
#                   the PNG (sample_point_values.py) for on-map numbers
#   point_decimals: decimals to keep in the published values (default 0)
#
# Models declare which products they publish in the `models:` map at the bottom.

products:
  refc:
    display: "Composite Reflectivity"
    # No trailing colon: HRRR/GFS idx lines say ":REFC:entire atmosphere:"
    # but RRFS writes ":REFC:entire atmosphere (considered as a single
    # layer):" — the prefix matches all three, still a single message each.
    wgrib2_match: ":REFC:entire atmosphere"
    units_in: "dBZ"
    units_out: "dBZ"
    convert: ""
    clr: "refc.clr"
    pal: "hrrr_refc.pal"
    # Smooth, interpolated color gradient (no -nearest_color_entry) so
    # reflectivity renders like RadarOmega instead of hard 5-dBZ bands.
    # All other products omit this flag and keep crisp binned colors.
    interpolate_color: true

  t2m:
    display: "2m Temperature"
    wgrib2_match: ":TMP:2 m above ground:"
    # GRIB encodes Kelvin per WMO convention, but GDAL's GRIB driver
    # auto-normalizes temperature to Celsius on read (per the GRIB
    # CF-conformance defaults). Convert Celsius -> Fahrenheit so the
    # .clr ramp (keyed in degF) lines up with the actual data.
    units_in: "C"
    units_out: "degF"
    convert: "A * 1.8 + 32"
    clr: "t2m.clr"
    pal: "hrrr_t2m.pal"
    point_values: true

  td2m:
    display: "2m Dewpoint"
    wgrib2_match: ":DPT:2 m above ground:"
    # GDAL auto-normalizes K -> C, same as t2m. See note there.
    units_in: "C"
    units_out: "degF"
    convert: "A * 1.8 + 32"
    clr: "td2m.clr"
    pal: "hrrr_td2m.pal"
    point_values: true

  wind10m:
    display: "10m Wind Speed"
    # Special: this product needs UGRD + VGRD combined into magnitude.
    # Handled with two-pass wgrib2 + gdal_calc; see decode_pipeline.sh.
    wgrib2_match: ":(UGRD|VGRD):10 m above ground:"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "hrrr_wind10m.pal"
    point_values: true

  gust10m:
    display: "10m Wind Gust"
    wgrib2_match: ":GUST:surface:"
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "hrrr_gust10m.pal"
    point_values: true

  mslp:
    display: "Mean Sea-Level Pressure"
    # HRRR uses MSLMA, NAM uses MSLET, GFS uses PRMSL.
    wgrib2_match: ":(MSLMA|MSLET|PRMSL):mean sea level:"
    units_in: "Pa"
    units_out: "hPa"
    convert: "A / 100.0"
    clr: "mslp.clr"
    pal: "hrrr_mslp.pal"
    point_values: true

  sfccape:
    display: "Surface CAPE"
    wgrib2_match: ":CAPE:surface:"
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cape.clr"
    pal: "hrrr_sfccape.pal"
    point_values: true

  precip1h:
    display: "1-hour Precipitation"
    # 1-hour bucket ending at the current fh: "(fh-1)-fh hour acc".
    # decode_pipeline.sh substitutes {fh} and {fh_minus_1} before matching.
    wgrib2_match: ":APCP:surface:{fh_minus_1}-{fh} hour acc"
    units_in: "kg/m^2"
    units_out: "in"
    convert: "A / 25.4"
    clr: "precip.clr"
    pal: "hrrr_precip1h.pal"
    point_values: true
    point_decimals: 2

  wind500:
    display: "500mb Wind Speed"
    wgrib2_match: ":(UGRD|VGRD):500 mb:"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "wind.clr"
    pal: "gfs_wind500.pal"
    point_values: true

  precipTotal:
    display: "Total Precipitation"
    wgrib2_match: ":APCP:surface:0-"
    units_in: "kg/m^2"
    units_out: "in"
    convert: "A / 25.4"
    clr: "precip.clr"
    pal: "gfs_precipTotal.pal"
    point_values: true
    point_decimals: 2

  # ── Mesoanalysis products ────────────────────────────────────────────────
  # Analysis-hour severe-weather parameters for the app's Mesoanalysis map
  # layer (SPC-mesoanalysis-style shaded fields under radar).
  #
  #   fh_cap: 1     render only f00 (the analysis) + f01 (bridge frame while
  #                 the next run's f00 is still publishing). Keeps the added
  #                 render cost to ~18 frames/hour instead of doubling ticks.
  #   category: meso  build_manifest.py publishes these in a separate
  #                 `mesoCatalog` so app versions that predate the meso layer
  #                 never see them in the Weather Models picker.
  #
  # Derived products (stp, scp) set `derived: true` with named `inputs`
  # (letter -> idx match regex, one message each) and a gdal_calc `calc`
  # expression over those letters. Formulas are kept EXACTLY in sync with
  # the app's sounding_analysis.dart (_stpFixed / _scp) so a tapped map
  # value never disagrees with the sounding sheet at the same point:
  #   * STP includes Thompson's CIN term (the app's deliberate choice) —
  #     values run lower than SPC's fixed-layer STP wherever SBCIN < -50.
  #   * SCP uses SRH3/BWD6 (the app's fallback when effective-layer values
  #     are unavailable).

  mlcape:
    display: "MLCAPE"
    wgrib2_match: ":CAPE:90-0 mb above ground:"
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cape.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    category: meso

  mucape:
    display: "MUCAPE"
    wgrib2_match: ":CAPE:255-0 mb above ground:"
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cape.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    category: meso

  mlcin:
    display: "MLCIN"
    wgrib2_match: ":CIN:90-0 mb above ground:"
    units_in: "J/kg"
    units_out: "J/kg"
    convert: ""
    clr: "cin.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    category: meso

  srh1:
    display: "0-1km SRH"
    wgrib2_match: ":HLCY:1000-0 m above ground:"
    units_in: "m^2/s^2"
    units_out: "m²/s²"
    convert: ""
    clr: "srh.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    category: meso

  srh3:
    display: "0-3km SRH"
    wgrib2_match: ":HLCY:3000-0 m above ground:"
    units_in: "m^2/s^2"
    units_out: "m²/s²"
    convert: ""
    clr: "srh.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    category: meso

  shear6:
    display: "0-6km Shear"
    # ⚠ HRRR labels VUCSH/VVCSH as [1/s] but the encoded values are the
    # bulk wind-difference vector components in m/s (verified empirically
    # 2026-07-08: magnitudes 0-35 with p99 ≈ 23 — true shear-per-second
    # would be ~0.005). Treat exactly like a U/V wind pair.
    wgrib2_match: ":(VUCSH|VVCSH):0-6000 m above ground:"
    composite_uv: true
    units_in: "m/s"
    units_out: "kt"
    convert: "A * 1.94384"
    clr: "shear.clr"
    pal: ""
    point_values: true
    fh_cap: 1
    category: meso

  stp:
    display: "Sig. Tornado (STP)"
    derived: true
    # Mirrors sounding_analysis.dart _stpFixed (STP-cin variant):
    #   capeTerm  = SBCAPE/1500
    #   lclTerm   = clip((2000 - LCL_agl)/1000, 0, 1)   LCL_agl = LCL_msl - terrain
    #   srhTerm   = SRH1/150
    #   shearTerm = 0 below 12.5 m/s, else min(shr6,30)/20  (cap 1.5)
    #   cinTerm   = clip((200 + SBCIN)/150, 0, 1)        (SBCIN is negative)
    inputs:
      A: ":CAPE:surface:"
      B: ":CIN:surface:"
      C: ":HGT:level of adiabatic condensation from sfc:"
      D: ":HGT:surface:"
      E: ":HLCY:1000-0 m above ground:"
      F: ":VUCSH:0-6000 m above ground:"
      G: ":VVCSH:0-6000 m above ground:"
    calc: "maximum((A/1500.0)*clip((2000.0-(C-D))/1000.0,0,1)*(E/150.0)*where(sqrt(F*F+G*G)<12.5,0,minimum(sqrt(F*F+G*G),30.0)/20.0)*clip((200.0+B)/150.0,0,1),0)"
    units_in: ""
    units_out: ""
    convert: ""
    clr: "stp.clr"
    pal: ""
    point_values: true
    point_decimals: 1
    fh_cap: 1
    category: meso

  scp:
    display: "Supercell Comp. (SCP)"
    # Mirrors sounding_analysis.dart _scp with the SRH3/BWD6 fallback:
    #   (MUCAPE/1000) * (SRH3/50) * shearTerm
    #   shearTerm = 0 below 10 m/s, else min(shr6,20)/20  (cap 1.0)
    inputs:
      A: ":CAPE:255-0 mb above ground:"
      B: ":HLCY:3000-0 m above ground:"
      C: ":VUCSH:0-6000 m above ground:"
      D: ":VVCSH:0-6000 m above ground:"
    calc: "maximum((A/1000.0)*(B/50.0)*where(sqrt(C*C+D*D)<10.0,0,minimum(sqrt(C*C+D*D),20.0)/20.0),0)"
    units_in: ""
    units_out: ""
    convert: ""
    clr: "scp.clr"
    pal: ""
    point_values: true
    point_decimals: 1
    fh_cap: 1
    category: meso

models:
  HRRR:
    products:
      - refc
      - t2m
      - td2m
      - wind10m
      - gust10m
      - mslp
      - sfccape
      - precip1h
      # Mesoanalysis set (fh_cap: 1 — analysis frames only; see product notes)
      - mlcape
      - mucape
      - mlcin
      - srh1
      - srh3
      - shear6
      - stp
      - scp
    # CONUS bbox (Lambert -> reprojected to EPSG:3857 by gdalwarp at render time)
    bbox_lonlat: [-134.0, 21.0, -60.0, 53.0]
    # Smoothness over sharpness (decided after testing). Animation scrub
    # cost is dominated by per-frame texture size: 2048^2 ≈ 16 MB RGBA,
    # 3072^2 ≈ 36 MB, 4096^2 ≈ 64 MB. 4096 (native ~3 km) and even 3072
    # made scrubbing stutter on phones, so we're back at 2048 — the
    # original, which scrubbed smoothly. Tradeoff: ~6 km/px (a little soft)
    # vs the model's native 3 km. Keep the cubic resampling below (it
    # sharpens edges slightly at zero playback cost — purely a render-time
    # kernel). If sharpness ever matters more than smooth animation, bump
    # this back up (4096 = native ceiling; mobile-GPU texture cap ~4096).
    image_size: [2048, 2048]
    # Point-value sample grid (sample_point_values.py). 128x128 over the
    # CONUS bbox ≈ one number every ~0.6° lon; evenly spaced on-screen in
    # mercator. The app decimates by zoom with power-of-2 strides, so keep
    # this a power of two.
    point_grid: [128, 128]
    # f00..f18 always; f00..f48 on synoptic runs.
    forecast_hours_default: { start: 0, end: 18, step: 1 }
    forecast_hours_synoptic: { start: 0, end: 48, step: 1, runs: [0, 6, 12, 18] }
    # AWS public bucket (no auth needed)
    s3_bucket: "noaa-hrrr-bdp-pds"
    s3_key_template: "hrrr.{date}/conus/hrrr.t{run:02d}z.wrfsfcf{fh:02d}.grib2"
    runs_per_day: 24
    retain_runs: 5

  RRFS:
    # NOAA's next-gen 3 km rapid-refresh model (operational Aug 31 2026;
    # pre-operational rrfs_a feed until then). The 2dfld CONUS file carries
    # every HRRR surface product PLUS a running-total APCP accumulation, so
    # RRFS publishes precipTotal too. wind500 lives in the separate
    # prslev.3km.na file (different key template) — not rendered in v1.
    products:
      - refc
      - t2m
      - td2m
      - wind10m
      - gust10m
      - mslp
      - sfccape
      - precip1h
      - precipTotal
    # Same CONUS render box + raster size as HRRR (both 3 km native; see the
    # HRRR image_size note for the 2048-vs-4096 scrub-smoothness tradeoff).
    # RRFS's CONUS subset grid doesn't cover this box edge-to-edge — the warp
    # leaves out-of-grid pixels transparent, which is fine.
    bbox_lonlat: [-134.0, 21.0, -60.0, 53.0]
    image_size: [2048, 2048]
    point_grid: [128, 128]
    # Hourly runs to f18; 00/06/12/18z extend to f84 (verified against the
    # rrfs_a bucket, July 2026).
    forecast_hours_default: { start: 0, end: 18, step: 1 }
    forecast_hours_synoptic: { start: 0, end: 84, step: 1, runs: [0, 6, 12, 18] }
    # AWS public bucket (no auth needed). ⚠ The rrfs_a/ prefix is the
    # pre-operational feed — expect this template to need a path bump when
    # RRFS goes operational (2026-08-31); the idx-HEAD-404 guard just makes
    # frames go stale rather than erroring if NOAA moves it.
    s3_bucket: "noaa-rrfs-pds"
    s3_key_template: "rrfs_a/rrfs.{date}/{run:02d}/rrfs.t{run:02d}z.2dfld.3km.f{fh:03d}.conus.grib2"
    runs_per_day: 24
    retain_runs: 5

  GFS:
    products:
      - refc
      - t2m
      - wind500
      - mslp
      - precipTotal
    # Global; we still render CONUS for app-side overlay parity. App can request
    # a global bbox later by adding a "GFS_GLOBAL" model entry.
    bbox_lonlat: [-134.0, 21.0, -60.0, 53.0]
    image_size: [1024, 1024]
    # Same grid as HRRR so the app-side decimation logic is model-agnostic.
    # GFS is 0.25° native, so 128 samples across 74° stays honest (no
    # sub-native oversampling worth worrying about).
    point_grid: [128, 128]
    forecast_hours_default: { start: 0, end: 120, step: 3 }
    s3_bucket: "noaa-gfs-bdp-pds"
    s3_key_template: "gfs.{date}/{run:02d}/atmos/gfs.t{run:02d}z.pgrb2.0p25.f{fh:03d}"
    runs_per_day: 4
    runs: [0, 6, 12, 18]
    retain_runs: 5
