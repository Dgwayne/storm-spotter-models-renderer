models:
  HRRR:
    products:
      - refc
      - refd1km
      - t2m
      - td2m
      - wind10m
      - gust10m
      - mslp
      - sfccape
      - sbcin
      - precip1h
      - precipTotal
      # Cloud cover family + simulated satellite (2026-08-05)
      - tcc
      - lcc
      - mcc
      - hcc
      - irsat
      # Fire weather / convective hazards (2026-08-05)
      - smokesfc
      - smokeint
      - ltng
      # Severe-parameter forecasts (full range, scrubbable in the models tab;
      # also_meso keeps them in the Mesoanalysis picker). Listed AFTER the
      # core surface products deliberately: render_hrrr.sh walks this list in
      # order, so a tick that runs long still lands reflectivity/temp/wind
      # first and only trails on the severe set.
      - srh1
      - srh3
      - ehi1
      - ehi3
      - uh25
      # Former analysis-only meso set — promoted to full-range dual-role
      # 2026-08-05 (see the Mesoanalysis section header note)
      - mlcape
      - mucape
      - mlcin
      - shear6
      - stp
      - scp
      # Meso catalog v2 (SPC-style groups) — promoted 2026-08-05 too
      - cape3km
      - liftedIdx
      - lapse75
      - lclHgt
      - shear1
      - stormMotion
      - pwat
      - echoTops
      - ptype
      - frzLvl
      - rh2m
      - vis
      # Winter (2026-08-05) — mostly-blank in August by nature; palettes
      # get their real visual check next cold season
      - snod
      - asnow
      - frzr
    # Parallel render groups: the workflow's plan job turns this map into a
    # job matrix, one render job per group (render_hrrr.sh PRODUCT_FILTER).
    # RULES:
    #   * Every product in `products` must appear in EXACTLY one group —
    #     the plan job diffs the union against the products list and fails
    #     the tick loudly on drift (a product missing from every group
    #     would otherwise silently never render).
    #   * `core` holds the headline products (reflectivity/temp/wind) in
    #     its own job so a long severe-param backfill can never starve
    #     them — the old single-job "list order = priority" trick, made
    #     structural.
    #   * Groups are balanced for FULL-RANGE load (each product ≈ same
    #     per-frame gdal cost; derived products just fetch a few more
    #     GRIB messages).
    render_groups:
      core:     [refc, t2m, td2m, wind10m, gust10m, mslp, sfccape, precip1h]
      sky:      [tcc, lcc, mcc, hcc, irsat, refd1km]
      hazards:  [smokesfc, smokeint, ltng, uh25, sbcin]
      winter:   [snod, asnow, frzr, precipTotal]
      severe-a: [srh1, srh3, ehi1, ehi3, shear1, shear6, stormMotion]
      severe-b: [mlcape, mucape, mlcin, cape3km, liftedIdx, lapse75, lclHgt]
      enviro:   [stp, scp, pwat, echoTops, ptype, frzLvl, rh2m, vis]
    # CONUS bbox (Lambert -> reprojected to EPSG:3857 by gdalwarp at render time)
    bbox_lonlat: [-134.0, 21.0, -60.0, 53.0]
    # Smoothness over sharpness (decided after testing). Animation scrub
    # cost is dominated by per-frame texture size: 2048^2 ≈ 16 MB RGBA,
    # 3072^2 ≈ 36 MB, 4096^2 ≈ 64 MB. 4096 (native ~3 km) and even 3072
    # made scrubbing stutter on phones, so we're back at 2048 — the
    # original, which scrubbed smoothly. Tradeoff: ~6 km/px (a little soft)
    # vs the model's native 3 km. Keep the cubic resampling below (it
    # sharpens edges slightly at zero playback cost — purely a render-time
    # kernel). If sharpness ever matters more than smooth animation, bump
    # this back up (4096 = native ceiling; mobile-GPU texture cap ~4096).
    image_size: [2048, 2048]
    # Point-value sample grid (sample_point_values.py). 128x128 over the
    # CONUS bbox ≈ one number every ~0.6° lon; evenly spaced on-screen in
    # mercator. The app decimates by zoom with power-of-2 strides, so keep
    # this a power of two.
    point_grid: [128, 128]
    # f00..f18 always; f00..f48 on synoptic runs.
    forecast_hours_default: { start: 0, end: 18, step: 1 }
    forecast_hours_synoptic: { start: 0, end: 48, step: 1, runs: [0, 6, 12, 18] }
    # AWS public bucket (no auth needed)
    s3_bucket: "noaa-hrrr-bdp-pds"
    s3_key_template: "hrrr.{date}/conus/hrrr.t{run:02d}z.wrfsfcf{fh:02d}.grib2"
    runs_per_day: 24
    retain_runs: 5

  RRFS:
    # NOAA's next-gen 3 km rapid-refresh model (operational Aug 31 2026;
    # pre-operational rrfs_a feed until then). The 2dfld CONUS file carries
    # every HRRR surface product PLUS a running-total APCP accumulation, so
    # RRFS publishes precipTotal too. wind500 lives in the separate
    # prslev.3km.na file (different key template) — not rendered in v1.
    products:
      - refc
      - refd1km
      - t2m
      - td2m
      - wind10m
      - gust10m
      - mslp
      - sfccape
      - sbcin
      - precip1h
      - precipTotal
      # 2026-08-05 expansion (Pivotal parity, mirrors HRRR where the 2dfld
      # file carries the field — verified in the 12z f009 idx). NOT here
      # because 2dfld genuinely differs: lapse75/wind500 (no pressure
      # levels), irsat (no SBT), smoke (RRFS MASSDEN/COLMD are split into
      # per-species aerosol messages — the HRRR match would grab organic
      # matter only; needs its own product definitions if ever wanted).
      # ⚠ TCDC appears as instantaneous AND hour-ave messages here — the
      # anchored prefix matches both and gdal_translate -b 1 takes the
      # FIRST in message order, which is the instantaneous one. LTNG is
      # an hourly max (fh_min 1 on the shared entry).
      - tcc
      - lcc
      - mcc
      - hcc
      - ltng
      - srh1
      - srh3
      - ehi1
      - ehi3
      - uh25
      - mlcape
      - mucape
      - mlcin
      - shear1
      - shear6
      - stp
      - scp
      - cape3km
      - liftedIdx
      - lclHgt
      - stormMotion
      - pwat
      - echoTops
      - ptype
      - frzLvl
      - rh2m
      - vis
      - snod
      - asnow
      - frzr
    # Parallel render groups — same contract as HRRR's (plan job enforces
    # exact coverage of the products list). RRFS synoptic runs reach f84,
    # the longest sweep of the three CONUS models — keep groups small.
    render_groups:
      core:     [refc, t2m, td2m, wind10m, gust10m, mslp, sfccape, precip1h]
      sky:      [tcc, lcc, mcc, hcc, refd1km]
      severe-a: [srh1, srh3, ehi1, ehi3, shear1, shear6, stormMotion]
      severe-b: [mlcape, mucape, mlcin, cape3km, sbcin, liftedIdx, lclHgt]
      hazards:  [stp, scp, ltng, uh25, ptype]
      enviro:   [pwat, echoTops, frzLvl, rh2m, vis]
      winter:   [snod, asnow, frzr, precipTotal]
    # Same CONUS render box + raster size as HRRR (both 3 km native; see the
    # HRRR image_size note for the 2048-vs-4096 scrub-smoothness tradeoff).
    # RRFS's CONUS subset grid doesn't cover this box edge-to-edge — the warp
    # leaves out-of-grid pixels transparent, which is fine.
    bbox_lonlat: [-134.0, 21.0, -60.0, 53.0]
    image_size: [2048, 2048]
    point_grid: [128, 128]
    # Hourly runs to f18; 00/06/12/18z extend to f84 (verified against the
    # rrfs_a bucket, July 2026).
    forecast_hours_default: { start: 0, end: 18, step: 1 }
    forecast_hours_synoptic: { start: 0, end: 84, step: 1, runs: [0, 6, 12, 18] }
    # AWS public bucket (no auth needed). ⚠ The rrfs_a/ prefix is the
    # pre-operational feed — expect this template to need a path bump when
    # RRFS goes operational (2026-08-31); the idx-HEAD-404 guard just makes
    # frames go stale rather than erroring if NOAA moves it.
    s3_bucket: "noaa-rrfs-pds"
    s3_key_template: "rrfs_a/rrfs.{date}/{run:02d}/rrfs.t{run:02d}z.2dfld.3km.f{fh:03d}.conus.grib2"
    runs_per_day: 24
    retain_runs: 5

  OBS:
    # Observed MRMS QPE pseudo-model (see the qpe* product notes above).
    # "Runs" are hourly valid stamps (accumulation end hour), each with a
    # single F000 frame — forecast_hours 0-0 makes build_manifest.py's
    # expected set exactly [0].
    products:
      - qpe01h
      - qpe03h
      - qpe06h
